<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Haven - 2.5D Farming</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="./src/styles/global.css">
    <script type="module" src="./src/styles/global.css"></script> <!-- Vite sometimes needs this for HMR of CSS? Or standard link is fine. Standard link is better. -->
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Loading Screen (Kept for initial load) -->
        <div id="loadingScreen">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <h1 class="loading-title">🌾 Cozy Haven</h1>
                <p class="loading-subtitle">Relaxing Farming Sim</p>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                
                <div class="progress-text" id="progressText">Initializing...</div>
                <div class="progress-details" id="progressDetails">Waking up the roosters...</div>
                <div class="asset-counter" id="assetCounter"></div>
                
                <button id="startButton" disabled>Wake Up</button>
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>
        
        <!-- Game UI Container (Managed by React) -->
        <!-- We can remove the old #gameUI block since App.tsx / IsometricGameScreen.tsx handles it -->
    </div>

    <!-- Main Entry Point -->
    <script type="module">
        // Import game modules
        import { GameLauncher } from './src/game/GameLauncher.js';
        import { FreeAssetDownloader } from './src/tools/FreeAssetDownloader.js';

        class CozyHavenGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.loadingScreen = document.getElementById('loadingScreen');
                // this.gameUI = document.getElementById('gameUI'); // Removed as per instruction
                this.startButton = document.getElementById('startButton');
                this.gameLauncher = null;
                this.assetDownloader = null;
                
                this.setupCanvas();
                this.setupEventListeners();
            }

            setupCanvas() {
                // Set canvas size
                this.canvas.width = Math.min(window.innerWidth * 0.9, 1200);
                this.canvas.height = Math.min(window.innerHeight * 0.9, 800);
                
                // Handle window resize
                window.addEventListener('resize', () => {
                    this.canvas.width = Math.min(window.innerWidth * 0.9, 1200);
                    this.canvas.height = Math.min(window.innerHeight * 0.9, 800);
                });
            }

            setupEventListeners() {
                this.startButton.addEventListener('click', () => {
                    this.launchGame();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape' && !this.loadingScreen.classList.contains('hidden')) {
                        // Quick launch for development
                        this.launchGame();
                    }
                });
            }

            async launchGame() {
                this.startButton.disabled = true;
                this.startButton.textContent = 'Launching...';
                
                try {
                    // Initialize game configuration
                    const gameConfig = {
                        renderer: 'webgl2',
                        quality: 'high',
                        platform: 'web',
                        assets: 'free',
                        performance: {
                            targetFPS: 60,
                            lodDistance: 50,
                            shadowQuality: 2,
                            textureResolution: 1
                        }
                    };

                    // Create game launcher
                    this.gameLauncher = new GameLauncher(this.canvas, gameConfig);
                    
                    // Launch the game with progress tracking
                    await this.gameLauncher.launchGame((progress) => {
                        this.updateProgress(progress);
                    });
                    
                    // Game launched successfully!
                    this.onGameLaunched();
                    
                } catch (error) {
                    console.error('Game launch failed:', error);
                    this.showError(error.message);
                    this.startButton.disabled = false;
                    this.startButton.textContent = 'Retry Launch';
                }
            }

            updateProgress(progress) {
                // Update progress bar with smooth animation
                const progressFill = document.getElementById('progressFill');
                const progressText = document.getElementById('progressText');
                const progressDetails = document.getElementById('progressDetails');
                const assetCounter = document.getElementById('assetCounter');
                
                // Smooth progress animation
                const currentWidth = parseFloat(progressFill.style.width) || 0;
                const targetWidth = progress.progress * 100;
                const newWidth = currentWidth + (targetWidth - currentWidth) * 0.3;
                progressFill.style.width = `${newWidth}%`;
                
                // Enhanced text with emoji support
                progressText.textContent = progress.stage || 'Loading...';
                progressDetails.textContent = progress.currentAsset || progress.details || 'Processing...';
                assetCounter.textContent = `${progress.assetsLoaded || 0} / ${progress.totalAssets || 1450} assets loaded`;
                
                // Add visual feedback for different stages
                if (progress.progress >= 1.0) {
                    this.startButton.disabled = false;
                    this.startButton.textContent = '🚀 Start Your Farm!';
                    this.startButton.style.background = 'linear-gradient(135deg, #4CAF50, #8BC34A)';
                    this.startButton.style.transform = 'scale(1.05)';
                } else if (progress.progress > 0.8) {
                    this.startButton.textContent = 'Almost Ready...';
                } else if (progress.progress > 0.5) {
                    this.startButton.textContent = 'Loading Assets...';
                }
            }

            onGameLaunched() {
                // Hide loading screen
                this.loadingScreen.classList.add('fade-out');
                
                setTimeout(() => {
                    this.loadingScreen.classList.add('hidden');
                    this.gameUI.classList.remove('hidden');
                    
                    // Start updating game stats
                    this.startStatsUpdate();
                    
                    // Setup game controls
                    this.setupGameControls();
                    
                }, 500);
            }

            startStatsUpdate() {
                setInterval(() => {
                    if (this.gameLauncher) {
                        const stats = this.gameLauncher.getGameStats();
                        
                        document.getElementById('fpsValue').textContent = Math.round(stats.fps);
                        document.getElementById('memoryValue').textContent = `${Math.round(stats.memoryUsage / 1024 / 1024)} MB`;
                        document.getElementById('objectsValue').textContent = stats.objectsRendered;
                        document.getElementById('launchTimeValue').textContent = `${Math.round(stats.launchTime / 1000)}s`;
                    }
                }, 1000);
            }

            setupGameControls() {
                // Additional game controls setup
                console.log('Game controls ready!');
                
                // Populate inventory (example)
                this.populateInventory();
            }

            populateInventory() {
                const inventoryGrid = document.getElementById('inventoryGrid');
                inventoryGrid.innerHTML = '';
                
                // Create inventory slots
                for (let i = 0; i < 16; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'inventory-slot';
                    
                    // Add some example items
                    if (i < 3) {
                        slot.classList.add('filled');
                        slot.textContent = ['🌾', '🥕', '🍅'][i];
                    }
                    
                    inventoryGrid.appendChild(slot);
                }
            }

            showError(message) {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = `Error: ${message}`;
                errorMessage.style.display = 'block';
            }
        }

        // Initialize game when page loads
        document.addEventListener('DOMContentLoaded', () => {
            const game = new CozyHavenGame();
            
            // Auto-launch after 2 seconds for demo
            setTimeout(() => {
                if (!document.getElementById('startButton').disabled) {
                    game.launchGame();
                }
            }, 2000);
        });
    </script>
</body>
</html>
