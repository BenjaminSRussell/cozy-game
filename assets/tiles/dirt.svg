<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-Down Square Base -->
  <rect width="64" height="64" fill="#795548"/>
  
  <!-- Texture Pattern (Top Down) -->
  <!-- Random pebbles (Circles, will become ellipses in iso) -->
  <circle cx="10" cy="10" r="3" fill="#5D4037" opacity="0.6"/>
  <circle cx="45" cy="50" r="2.5" fill="#5D4037" opacity="0.6"/>
  <circle cx="55" cy="15" r="4" fill="#8D6E63" opacity="0.4"/>
  <circle cx="20" cy="55" r="3" fill="#6D4C41" opacity="0.5"/>
  <circle cx="35" cy="30" r="5" fill="#4E342E" opacity="0.3"/>
  
  <!-- Uneven patches -->
  <path d="M5 40 Q20 35 30 45" stroke="#5D4037" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M40 20 Q55 25 50 10" stroke="#5D4037" stroke-width="2" fill="none" opacity="0.4"/>
  
  <!-- Subtle Grid Border (Optional, helps visual separation) -->
  <rect x="0.5" y="0.5" width="63" height="63" fill="none" stroke="#3E2723" stroke-width="1" opacity="0.2"/>
</svg>
