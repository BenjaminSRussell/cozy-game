<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Tree trunk -->
  <rect x="55" y="70" width="18" height="50" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Tree trunk details -->
  <line x1="60" y1="75" x2="60" y2="115" stroke="#654321" stroke-width="1" opacity="0.5"/>
  <line x1="68" y1="80" x2="68" y2="120" stroke="#654321" stroke-width="1" opacity="0.5"/>
  
  <!-- Main tree crown (cartoon puffy style) -->
  <circle cx="64" cy="50" r="25" fill="#228B22" stroke="#006400" stroke-width="2"/>
  <circle cx="45" cy="55" r="20" fill="#32CD32" stroke="#228B22" stroke-width="2"/>
  <circle cx="83" cy="55" r="20" fill="#32CD32" stroke="#228B22" stroke-width="2"/>
  <circle cx="55" cy="35" r="18" fill="#228B22" stroke="#006400" stroke-width="2"/>
  <circle cx="73" cy="35" r="18" fill="#228B22" stroke="#006400" stroke-width="2"/>
  <circle cx="64" cy="25" r="15" fill="#32CD32" stroke="#228B22" stroke-width="2"/>
  
  <!-- Tree face -->
  <circle cx="55" cy="45" r="3" fill="#000000"/>
  <circle cx="73" cy="45" r="3" fill="#000000"/>
  <path d="M55 58 Q64 65 73 58" stroke="#000000" stroke-width="2" fill="none"/>
  
  <!-- Cute apples -->
  <circle cx="40" cy="50" r="4" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
  <circle cx="88" cy="48" r="4" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
  <circle cx="60" cy="30" r="3.5" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
  
  <!-- Apple stems -->
  <line x1="40" y1="46" x2="40" y2="44" stroke="#654321" stroke-width="0.5"/>
  <line x1="88" y1="44" x2="88" y2="42" stroke="#654321" stroke-width="0.5"/>
  <line x1="60" y1="26.5" x2="60" y2="24.5" stroke="#654321" stroke-width="0.5"/>
  
  <!-- Sparkles -->
  <circle cx="35" cy="35" r="1" fill="#FFD700"/>
  <circle cx="95" cy="40" r="1" fill="#FFD700"/>
  <circle cx="70" cy="20" r="1" fill="#FFD700"/>
  
  <!-- Grass at base -->
  <ellipse cx="50" cy="118" rx="8" ry="3" fill="#228B22"/>
  <ellipse cx="78" cy="118" rx="8" ry="3" fill="#228B22"/>
</svg>
