<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Lamp post -->
  <rect x="30" y="25" width="4" height="35" fill="#696969" stroke="#2F4F4F" stroke-width="1"/>
  
  <!-- Lamp base -->
  <ellipse cx="32" cy="60" rx="8" ry="3" fill="#2F4F4F"/>
  <rect x="28" y="55" width="8" height="5" fill="#696969"/>
  
  <!-- Lamp arm -->
  <rect x="20" y="22" width="24" height="3" fill="#696969" stroke="#2F4F4F" stroke-width="1"/>
  
  <!-- Lamp glass -->
  <path d="M18 15 L18 25 Q32 30 46 25 L46 15 Z" fill="#87CEEB" stroke="#4682B4" stroke-width="2" opacity="0.8"/>
  
  <!-- Light inside -->
  <ellipse cx="32" cy="20" rx="12" ry="6" fill="#FFFFE0" opacity="0.9"/>
  
  <!-- Lamp top -->
  <polygon points="16,15 32,8 48,15" fill="#2F4F4F" stroke="#000000" stroke-width="1"/>
  
  <!-- Light rays -->
  <line x1="32" y1="20" x2="25" y2="10" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="20" x2="39" y2="10" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="20" x2="20" y2="18" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="20" x2="44" y2="18" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  
  <!-- Cute face on lamp -->
  <circle cx="28" cy="20" r="1" fill="#000000"/>
  <circle cx="36" cy="20" r="1" fill="#000000"/>
  <path d="M28 23 Q32 25 36 23" stroke="#000000" stroke-width="0.8" fill="none"/>
</svg>
