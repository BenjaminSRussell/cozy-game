<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Stone foundation -->
  <rect x="28" y="115" width="72" height="8" fill="#808080" stroke="#696969" stroke-width="2"/>
  <rect x="28" y="118" width="72" height="2" fill="#696969"/>
  
  <!-- Shed base with weathered wood -->
  <rect x="30" y="70" width="68" height="45" fill="#B8860B" stroke="#8B6914" stroke-width="3"/>
  
  <!-- Wood planks with gaps -->
  <rect x="32" y="72" width="12" height="41" fill="#CD853F" stroke="#8B4513" stroke-width="1"/>
  <rect x="46" y="72" width="12" height="41" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  <rect x="60" y="72" width="12" height="41" fill="#CD853F" stroke="#8B4513" stroke-width="1"/>
  <rect x="74" y="72" width="12" height="41" fill="#D2691E" stroke="#8B4513" stroke-width="1"/>
  <rect x="88" y="72" width="8" height="41" fill="#CD853F" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Vertical support beams -->
  <rect x="35" y="70" width="4" height="45" fill="#654321"/>
  <rect x="55" y="70" width="4" height="45" fill="#654321"/>
  <rect x="75" y="70" width="4" height="45" fill="#654321"/>
  
  <!-- Metal roof -->
  <polygon points="25,70 64,35 103,70" fill="#696969" stroke="#2F4F4F" stroke-width="2"/>
  
  <!-- Roof panels -->
  <line x1="25" y1="52" x2="64" y2="35" stroke="#2F4F4F" stroke-width="2"/>
  <line x1="64" y1="35" x2="103" y2="52" stroke="#2F4F4F" stroke-width="2"/>
  <line x1="40" y1="43" x2="64" y2="25" stroke="#2F4F4F" stroke-width="1"/>
  <line x1="64" y1="25" x2="88" y2="43" stroke="#2F4F4F" stroke-width="1"/>
  
  <!-- Large barn door -->
  <rect x="52" y="85" width="24" height="30" fill="#4A4A4A" stroke="#2F4F4F" stroke-width="2"/>
  <rect x="54" y="87" width="20" height="3" fill="#696969"/>
  <rect x="54" y="93" width="20" height="3" fill="#696969"/>
  <rect x="54" y="99" width="20" height="3" fill="#696969"/>
  <circle cx="68" cy="100" r="2" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
  
  <!-- Door hinges -->
  <rect x="54" y="90" width="2" height="8" fill="#2F4F4F"/>
  <rect x="72" y="90" width="2" height="8" fill="#2F4F4F"/>
  
  <!-- Large window -->
  <rect x="75" y="75" width="18" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="84" y1="75" x2="84" y2="90" stroke="#8B4513" stroke-width="2"/>
  <line x1="75" y1="82" x2="93" y2="82" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Window box -->
  <rect x="73" y="90" width="22" height="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Tools wall -->
  <rect x="35" y="75" width="12" height="3" fill="#696969"/>
  <circle cx="38" cy="76.5" r="3" fill="#C0C0C0" stroke="#808080" stroke-width="1"/>
  <rect x="48" y="78" width="10" height="2" fill="#8B4513"/>
  <circle cx="50" cy="79" r="2" fill="#654321"/>
  
  <!-- Rake -->
  <rect x="60" y="76" width="8" height="1.5" fill="#8B4513"/>
  <line x1="60" y1="77.5" x2="68" y2="77.5" stroke="#654321" stroke-width="1"/>
  <line x1="62" y1="75" x2="62" y2="80" stroke="#654321" stroke-width="0.5"/>
  <line x1="66" y1="75" x2="66" y2="80" stroke="#654321" stroke-width="0.5"/>
  
  <!-- Ventilation -->
  <rect x="85" y="72" width="3" height="12" fill="#2F4F4F" opacity="0.8"/>
  
  <!-- Hay loft -->
  <rect x="40" y="40" width="48" height="25" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="42" y="42" width="44" height="2" fill="#A0522D"/>
  <rect x="42" y="48" width="44" height="2" fill="#A0522D"/>
  <rect x="42" y="54" width="44" height="2" fill="#A0522D"/>
  
  <!-- Loft door -->
  <rect x="55" y="45" width="18" height="20" fill="#654321" stroke="#4A4A4A" stroke-width="2"/>
  <line x1="64" y1="45" x2="64" y2="65" stroke="#4A4A4A" stroke-width="2"/>
  
  <!-- Hay sticking out -->
  <rect x="47" y="38" width="10" height="4" fill="#F4A460" opacity="0.9"/>
  <rect x="71" y="38" width="10" height="4" fill="#F4A460" opacity="0.9"/>
  <rect x="59" y="36" width="8" height="3" fill="#DEB887" opacity="0.8"/>
  
  <!-- Grass and weeds -->
  <ellipse cx="25" cy="118" rx="10" ry="4" fill="#228B22"/>
  <ellipse cx="103" cy="118" rx="10" ry="4" fill="#32CD32"/>
  <ellipse cx="64" cy="119" rx="8" ry="3" fill="#228B22"/>
  
  <!-- Flowers -->
  <circle cx="20" cy="117" r="2" fill="#FF69B4"/>
  <circle cx="108" cy="117" r="2" fill="#FFD700"/>
  <circle cx="30" cy="116" r="1.5" fill="#FF1493"/>
  <circle cx="98" cy="116" r="1.5" fill="#FFA500"/>
  
  <!-- Weather vane on roof -->
  <rect x="62" y="30" width="4" height="5" fill="#2F4F4F"/>
  <polygon points="64,25 70,30 64,35 58,30" fill="#FF6347" stroke="#CD5C5C" stroke-width="1"/>
</svg>
