<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Stone foundation -->
  <rect x="18" y="115" width="92" height="5" fill="#808080" stroke="#696969" stroke-width="1"/>
  
  <!-- Market base -->
  <rect x="20" y="70" width="88" height="45" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Wood texture -->
  <rect x="20" y="75" width="88" height="3" fill="#FFA500" opacity="0.6"/>
  <rect x="20" y="85" width="88" height="3" fill="#FFA500" opacity="0.6"/>
  <rect x="20" y="95" width="88" height="3" fill="#FFA500" opacity="0.6"/>
  <rect x="20" y="105" width="88" height="3" fill="#FFA500" opacity="0.6"/>
  
  <!-- Simple support posts -->
  <rect x="25" y="70" width="6" height="45" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="97" y="70" width="6" height="45" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Colorful striped roof -->
  <polygon points="10,70 64,30 118,70" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
  
  <!-- Roof stripes -->
  <rect x="10" y="65" width="108" height="5" fill="#FF69B4"/>
  <rect x="10" y="55" width="108" height="5" fill="#87CEEB"/>
  <rect x="10" y="45" width="108" height="5" fill="#98FB98"/>
  
  <!-- Double doors -->
  <rect x="40" y="85" width="20" height="30" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="68" y="85" width="20" height="30" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Door details -->
  <rect x="42" y="87" width="16" height="2" fill="#A0522D"/>
  <rect x="42" y="92" width="16" height="2" fill="#A0522D"/>
  <rect x="42" y="97" width="16" height="2" fill="#A0522D"/>
  <rect x="70" y="87" width="16" height="2" fill="#A0522D"/>
  <rect x="70" y="92" width="16" height="2" fill="#A0522D"/>
  <rect x="70" y="97" width="16" height="2" fill="#A0522D"/>
  
  <!-- Door handles -->
  <circle cx="55" cy="100" r="1.5" fill="#FFD700"/>
  <circle cx="78" cy="100" r="1.5" fill="#FFD700"/>
  
  <!-- Display windows -->
  <rect x="25" y="75" width="10" height="8" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <rect x="93" y="75" width="10" height="8" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  
    
  <!-- Produce displays -->
  <circle cx="35" cy="108" r="3" fill="#FF6347"/>
  <circle cx="45" cy="108" r="3" fill="#FFA500"/>
  <circle cx="83" cy="108" r="3" fill="#90EE90"/>
  <circle cx="93" cy="108" r="3" fill="#FFD700"/>
  
  <!-- Flower pots -->
  <circle cx="15" cy="115" r="3" fill="#8B4513"/>
  <circle cx="113" cy="115" r="3" fill="#8B4513"/>
  <circle cx="15" cy="112" r="2" fill="#FF69B4"/>
  <circle cx="113" cy="112" r="2" fill="#FFD700"/>
  
  </svg>
