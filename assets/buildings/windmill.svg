<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Windmill base -->
  <rect x="50" y="60" width="28" height="60" fill="#F5DEB3" stroke="#DEB887" stroke-width="2"/>
  
  <!-- Stone foundation -->
  <rect x="48" y="110" width="32" height="10" fill="#808080" stroke="#696969" stroke-width="1"/>
  <rect x="46" y="115" width="36" height="5" fill="#696969" stroke="#2F4F4F" stroke-width="1"/>
  
  <!-- Roof -->
  <polygon points="40,60 64,20 88,60" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Windmill blades center (static) -->
  <circle cx="64" cy="40" r="4" fill="#654321" stroke="#4A4A4A" stroke-width="1"/>
  
  <!-- Vertical support -->
  <rect x="62" y="20" width="4" height="20" fill="#654321"/>
  
  <!-- Static windmill blades (4-blade design) -->
  <g transform="translate(64, 40)">
    <!-- Top blade -->
    <rect x="-2" y="-20" width="4" height="20" fill="#FFF" stroke="#000" stroke-width="1"/>
    <polygon points="-3,-20 0,-25 3,-20" fill="#FFF" stroke="#000" stroke-width="1"/>
    
    <!-- Right blade -->
    <rect x="0" y="-2" width="20" height="4" fill="#FFF" stroke="#000" stroke-width="1"/>
    <polygon points="20,-3 25,0 20,3" fill="#FFF" stroke="#000" stroke-width="1"/>
    
    <!-- Bottom blade -->
    <rect x="-2" y="0" width="4" height="20" fill="#FFF" stroke="#000" stroke-width="1"/>
    <polygon points="-3,20 0,25 3,20" fill="#FFF" stroke="#000" stroke-width="1"/>
    
    <!-- Left blade -->
    <rect x="-20" y="-2" width="20" height="4" fill="#FFF" stroke="#000" stroke-width="1"/>
    <polygon points="-20,-3 -25,0 -20,3" fill="#FFF" stroke="#000" stroke-width="1"/>
  </g>
  
  <!-- Door -->
  <rect x="55" y="85" width="18" height="35" fill="#654321" stroke="#4A4A4A" stroke-width="2"/>
  <circle cx="68" cy="102" r="1.5" fill="#8B4513"/>
  
  <!-- Window -->
  <rect x="59" y="70" width="10" height="10" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="64" y1="70" x2="64" y2="80" stroke="#4682B4" stroke-width="1"/>
  <line x1="59" y1="75" x2="69" y2="75" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Textured details -->
  <rect x="50" y="65" width="28" height="2" fill="#E6D4B1"/>
  <rect x="50" y="75" width="28" height="2" fill="#E6D4B1"/>
  <rect x="50" y="85" width="28" height="2" fill="#E6D4B1"/>
  <rect x="50" y="95" width="28" height="2" fill="#E6D4B1"/>
</svg>
