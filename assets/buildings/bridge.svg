<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Water under bridge -->
  <rect x="0" y="95" width="128" height="20" fill="#4682B4" opacity="0.6"/>
  <rect x="0" y="97" width="128" height="3" fill="#87CEEB" opacity="0.4"/>
  <rect x="0" y="105" width="128" height="3" fill="#87CEEB" opacity="0.3"/>
  
  <!-- Water ripples -->
  <ellipse cx="20" cy="100" rx="8" ry="2" fill="#B0E0E6" opacity="0.4"/>
  <ellipse cx="60" cy="105" rx="6" ry="1.5" fill="#B0E0E6" opacity="0.3"/>
  <ellipse cx="100" cy="102" rx="7" ry="2" fill="#B0E0E6" opacity="0.4"/>
  
  <!-- Bridge deck -->
  <rect x="0" y="75" width="128" height="20" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Wood planks -->
  <rect x="0" y="77" width="128" height="3" fill="#A0522D" opacity="0.8"/>
  <rect x="0" y="82" width="128" height="3" fill="#A0522D" opacity="0.8"/>
  <rect x="0" y="87" width="128" height="3" fill="#A0522D" opacity="0.8"/>
  
  <!-- Wood grain -->
  <line x1="0" y1="79" x2="128" y2="79" stroke="#8B4513" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="84" x2="128" y2="84" stroke="#8B4513" stroke-width="0.5" opacity="0.6"/>
  <line x1="0" y1="89" x2="128" y2="89" stroke="#8B4513" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Support posts with stone bases -->
  <rect x="8" y="60" width="12" height="35" fill="#808080" stroke="#696969" stroke-width="1"/>
  <rect x="8" y="65" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="8" y="75" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="8" y="85" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  
  <rect x="38" y="60" width="12" height="35" fill="#808080" stroke="#696969" stroke-width="1"/>
  <rect x="38" y="65" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="38" y="75" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="38" y="85" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  
  <rect x="68" y="60" width="12" height="35" fill="#808080" stroke="#696969" stroke-width="1"/>
  <rect x="68" y="65" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="68" y="75" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="68" y="85" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  
  <rect x="98" y="60" width="12" height="35" fill="#808080" stroke="#696969" stroke-width="1"/>
  <rect x="98" y="65" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="98" y="75" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  <rect x="98" y="85" width="12" height="4" fill="#A9A9A9" opacity="0.7"/>
  
  <!-- Mortar lines on posts -->
  <line x1="12" y1="60" x2="12" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="16" y1="60" x2="16" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="42" y1="60" x2="42" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="46" y1="60" x2="46" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="72" y1="60" x2="72" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="76" y1="60" x2="76" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="102" y1="60" x2="102" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  <line x1="106" y1="60" x2="106" y2="95" stroke="#696969" stroke-width="1" opacity="0.5"/>
  
  <!-- Main support beams -->
  <rect x="0" y="80" width="128" height="4" fill="#654321"/>
  
  <!-- Diagonal braces -->
  <polygon points="10,75 20,60 30,75" fill="#A0522D" opacity="0.8"/>
  <polygon points="40,75 50,60 60,75" fill="#A0522D" opacity="0.8"/>
  <polygon points="70,75 80,60 90,75" fill="#A0522D" opacity="0.8"/>
  <polygon points="100,75 110,60 120,75" fill="#A0522D" opacity="0.8"/>
  
  <!-- Rope handrails -->
  <line x1="0" y1="70" x2="128" y2="70" stroke="#8B4513" stroke-width="3"/>
  <line x1="0" y1="68" x2="128" y2="68" stroke="#A0522D" stroke-width="1"/>
  
  <!-- Rope posts -->
  <rect x="8" y="65" width="3" height="8" fill="#8B4513"/>
  <rect x="38" y="65" width="3" height="8" fill="#8B4513"/>
  <rect x="68" y="65" width="3" height="8" fill="#8B4513"/>
  <rect x="98" y="65" width="3" height="8" fill="#8B4513"/>
  <rect x="117" y="65" width="3" height="8" fill="#8B4513"/>
  
  <!-- Wood knots on deck -->
  <circle cx="25" cy="82" r="1" fill="#654321" opacity="0.5"/>
  <circle cx="55" cy="85" r="0.8" fill="#654321" opacity="0.4"/>
  <circle cx="85" cy="83" r="1.2" fill="#654321" opacity="0.6"/>
  <circle cx="115" cy="86" r="0.6" fill="#654321" opacity="0.4"/>
  
  <!-- Nail heads -->
  <circle cx="14" cy="80" r="0.3" fill="#696969"/>
  <circle cx="44" cy="80" r="0.3" fill="#696969"/>
  <circle cx="74" cy="80" r="0.3" fill="#696969"/>
  <circle cx="104" cy="80" r="0.3" fill="#696969"/>
  
  <!-- Moss on posts -->
  <ellipse cx="14" cy="58" rx="2" ry="1" fill="#228B22" opacity="0.4"/>
  <ellipse cx="44" cy="56" rx="1.5" ry="1" fill="#32CD32" opacity="0.3"/>
  <ellipse cx="74" cy="57" rx="2" ry="1" fill="#228B22" opacity="0.4"/>
  <ellipse cx="104" cy="55" rx="1.5" ry="1" fill="#32CD32" opacity="0.3"/>
  
  <!-- Small fish in water -->
  <ellipse cx="30" cy="102" rx="2" ry="0.5" fill="#4169E1" opacity="0.6"/>
  <ellipse cx="70" cy="108" rx="1.5" ry="0.4" fill="#4169E1" opacity="0.5"/>
  <ellipse cx="110" cy="105" rx="1.8" ry="0.4" fill="#4169E1" opacity="0.5"/>
</svg>
