<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Stone foundation -->
  <rect x="43" y="115" width="42" height="5" fill="#808080" stroke="#696969" stroke-width="1"/>
  
  <!-- Tower base -->
  <rect x="45" y="40" width="38" height="75" fill="#D3D3D3" stroke="#A9A9A9" stroke-width="2"/>
  
  <!-- Stone brick pattern -->
  <rect x="45" y="45" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  <rect x="45" y="55" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  <rect x="45" y="65" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  <rect x="45" y="75" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  <rect x="45" y="85" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  <rect x="45" y="95" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  <rect x="45" y="105" width="38" height="4" fill="#B8B8B8" opacity="0.7"/>
  
  <!-- Mortar lines -->
  <line x1="50" y1="40" x2="50" y2="115" stroke="#A9A9A9" stroke-width="1" opacity="0.5"/>
  <line x1="58" y1="40" x2="58" y2="115" stroke="#A9A9A9" stroke-width="1" opacity="0.5"/>
  <line x1="66" y1="40" x2="66" y2="115" stroke="#A9A9A9" stroke-width="1" opacity="0.5"/>
  <line x1="74" y1="40" x2="74" y2="115" stroke="#A9A9A9" stroke-width="1" opacity="0.5"/>
  
  <!-- Cone roof -->
  <polygon points="35,40 64,15 93,40" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Roof shingles -->
  <line x1="40" y1="35" x2="55" y2="25" stroke="#654321" stroke-width="1"/>
  <line x1="50" y1="22" x2="65" y2="12" stroke="#654321" stroke-width="1"/>
  <line x1="60" y1="17" x2="75" y2="27" stroke="#654321" stroke-width="1"/>
  <line x1="70" y1="25" x2="85" y2="35" stroke="#654321" stroke-width="1"/>
  
  <!-- Flag pole -->
  <rect x="62" y="15" width="4" height="25" fill="#654321"/>
  <circle cx="64" cy="15" r="2" fill="#4A4A4A"/>
  
  <!-- Flag -->
  <polygon points="66,15 80,20 66,25" fill="#FF6347" stroke="#CD5C5C" stroke-width="1"/>
  <polygon points="66,17 76,20 66,23" fill="#FFF" stroke="#000" stroke-width="0.5"/>
  
  <!-- Door -->
  <rect x="55" y="85" width="18" height="30" fill="#654321" stroke="#4B2F20" stroke-width="2"/>
  <rect x="57" y="87" width="14" height="2" fill="#8B4513"/>
  <rect x="57" y="92" width="14" height="2" fill="#8B4513"/>
  <rect x="57" y="97" width="14" height="2" fill="#8B4513"/>
  <rect x="57" y="102" width="14" height="2" fill="#8B4513"/>
  <circle cx="68" cy="100" r="1.5" fill="#FFD700"/>
  
  <!-- Door handle -->
  <rect x="66" y="98" width="2" height="3" fill="#8B4513"/>
  
  <!-- Windows with shutters -->
  <rect x="50" y="50" width="10" height="10" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="55" y1="50" x2="55" y2="60" stroke="#4682B4" stroke-width="1"/>
  <line x1="50" y1="55" x2="60" y2="55" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Left shutter -->
  <rect x="46" y="50" width="4" height="10" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="47" y="52" width="2" height="2" fill="#A0522D"/>
  <rect x="47" y="56" width="2" height="2" fill="#A0522D"/>
  
  <!-- Right shutter -->
  <rect x="60" y="50" width="4" height="10" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="61" y="52" width="2" height="2" fill="#A0522D"/>
  <rect x="61" y="56" width="2" height="2" fill="#A0522D"/>
  
  <rect x="68" y="50" width="10" height="10" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="73" y1="50" x2="73" y2="60" stroke="#4682B4" stroke-width="1"/>
  <line x1="68" y1="55" x2="78" y2="55" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Left shutter -->
  <rect x="64" y="50" width="4" height="10" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="65" y="52" width="2" height="2" fill="#A0522D"/>
  <rect x="65" y="56" width="2" height="2" fill="#A0522D"/>
  
  <!-- Right shutter -->
  <rect x="78" y="50" width="4" height="10" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="79" y="52" width="2" height="2" fill="#A0522D"/>
  <rect x="79" y="56" width="2" height="2" fill="#A0522D"/>
  
  <rect x="59" y="70" width="10" height="10" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="64" y1="70" x2="64" y2="80" stroke="#4682B4" stroke-width="1"/>
  <line x1="59" y1="75" x2="69" y2="75" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Observation deck railing -->
  <rect x="45" y="35" width="38" height="2" fill="#654321"/>
  <rect x="47" y="32" width="2" height="5" fill="#654321"/>
  <rect x="55" y="32" width="2" height="5" fill="#654321"/>
  <rect x="63" y="32" width="2" height="5" fill="#654321"/>
  <rect x="71" y="32" width="2" height="5" fill="#654321"/>
  <rect x="79" y="32" width="2" height="5" fill="#654321"/>
  
  <!-- Torch holders -->
  <rect x="40" y="60" width="3" height="3" fill="#654321"/>
  <circle cx="41.5" cy="58" r="1" fill="#FFA500" opacity="0.8"/>
  
  <rect x="85" y="60" width="3" height="3" fill="#654321"/>
  <circle cx="86.5" cy="58" r="1" fill="#FFA500" opacity="0.8"/>
  
  <!-- Stone cracks -->
  <line x1="48" y1="70" x2="50" y2="75" stroke="#696969" stroke-width="1" opacity="0.4"/>
  <line x1="75" y1="90" x2="77" y2="95" stroke="#696969" stroke-width="1" opacity="0.3"/>
  
  <!-- Ivy growing on tower -->
  <ellipse cx="42" cy="80" rx="2" ry="8" fill="#228B22" opacity="0.4"/>
  <ellipse cx="86" cy="70" rx="1.5" ry="6" fill="#32CD32" opacity="0.3"/>
  <ellipse cx="50" cy="100" rx="1" ry="4" fill="#228B22" opacity="0.3"/>
</svg>
