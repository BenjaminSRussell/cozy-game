<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Stone foundation -->
  <rect x="23" y="115" width="82" height="5" fill="#808080" stroke="#696969" stroke-width="1"/>
  
  <!-- House base -->
  <rect x="25" y="55" width="78" height="60" fill="#FFE4B5" stroke="#DEB887" stroke-width="2"/>
  
  <!-- Wood texture on walls -->
  <rect x="25" y="60" width="78" height="3" fill="#F5DEB3" opacity="0.7"/>
  <rect x="25" y="70" width="78" height="3" fill="#F5DEB3" opacity="0.7"/>
  <rect x="25" y="80" width="78" height="3" fill="#F5DEB3" opacity="0.7"/>
  <rect x="25" y="90" width="78" height="3" fill="#F5DEB3" opacity="0.7"/>
  <rect x="25" y="100" width="78" height="3" fill="#F5DEB3" opacity="0.7"/>
  
  <!-- Roof -->
  <polygon points="15,55 64,15 113,55" fill="#FF6347" stroke="#CD5C5C" stroke-width="2"/>
  
  <!-- Roof shingles -->
  <line x1="25" y1="45" x2="45" y2="35" stroke="#CD5C5C" stroke-width="1"/>
  <line x1="50" y1="30" x2="70" y2="20" stroke="#CD5C5C" stroke-width="1"/>
  <line x1="75" y1="25" x2="95" y2="35" stroke="#CD5C5C" stroke-width="1"/>
  
  <!-- Chimney -->
  <rect x="85" y="25" width="15" height="25" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="82" y="20" width="21" height="8" fill="#696969" stroke="#2F4F4F" stroke-width="1"/>
  
  <!-- Smoke -->
  <circle cx="92" cy="15" r="3" fill="#D3D3D3" opacity="0.6"/>
  <circle cx="95" cy="10" r="4" fill="#C0C0C0" opacity="0.5"/>
  <circle cx="90" cy="5" r="5" fill="#A9A9A9" opacity="0.4"/>
  
  <!-- Door -->
  <rect x="52" y="85" width="24" height="30" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <rect x="54" y="87" width="20" height="2" fill="#A0522D"/>
  <rect x="54" y="92" width="20" height="2" fill="#A0522D"/>
  <rect x="54" y="97" width="20" height="2" fill="#A0522D"/>
  <circle cx="70" cy="100" r="2" fill="#FFD700"/>
  
  <!-- Windows -->
  <rect x="35" y="65" width="15" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="42.5" y1="65" x2="42.5" y2="80" stroke="#4682B4" stroke-width="1"/>
  <line x1="35" y1="72.5" x2="50" y2="72.5" stroke="#4682B4" stroke-width="1"/>
  
  <rect x="78" y="65" width="15" height="15" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="85.5" y1="65" x2="85.5" y2="80" stroke="#4682B4" stroke-width="1"/>
  <line x1="78" y1="72.5" x2="93" y2="72.5" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Flowers -->
  <circle cx="20" cy="115" r="3" fill="#FF69B4"/>
  <circle cx="108" cy="115" r="3" fill="#FFD700"/>
  <circle cx="25" cy="118" r="2" fill="#FF1493"/>
  <circle cx="103" cy="118" r="2" fill="#FFA500"/>
  
  <!-- Window boxes -->
  <rect x="33" y="80" width="19" height="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  <rect x="76" y="80" width="19" height="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
</svg>
