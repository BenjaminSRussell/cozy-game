<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- 
    Isometric Barn (Standardized)
    Logical Footprint: 2x3 tiles
    Perspective: True Isometric (30 deg / 2:1 pixel ratio)
    Orientation: Facing South (Seeing SE and SW walls)
  -->
  
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Shadow/Footprint Guide (Hidden in final, useful for debug) -->
  <!-- <path d="M128 240 L64 208 L128 176 L192 208 Z" fill="rgba(0,0,0,0.2)" /> -->

  <!-- Main Structure Group -->
  <g filter="url(#shadow)" transform="translate(0, -32)">
    
    <!-- LEFT WALL (SW Face) - Darker Shade -->
    <!-- Base: (64, 208) to (128, 240) -->
    <!-- Height: 100px -->
    <path d="M64 208 L64 108 L128 140 L128 240 Z" fill="#8B4513" stroke="#5D4037" stroke-width="2"/>
    
    <!-- RIGHT WALL (SE Face) - Lighter Shade -->
    <!-- Base: (128, 240) to (192, 208) -->
    <!-- Height: 100px -->
    <path d="M128 240 L128 140 L192 108 L192 208 Z" fill="#A0522D" stroke="#5D4037" stroke-width="2"/>

    <!-- WOOD SIDING TEXTURE (Left) -->
    <path d="M64 128 L128 160" stroke="#5D4037" stroke-width="1" opacity="0.5"/>
    <path d="M64 148 L128 180" stroke="#5D4037" stroke-width="1" opacity="0.5"/>
    <path d="M64 168 L128 200" stroke="#5D4037" stroke-width="1" opacity="0.5"/>
    <path d="M64 188 L128 220" stroke="#5D4037" stroke-width="1" opacity="0.5"/>

    <!-- WOOD SIDING TEXTURE (Right) -->
    <path d="M128 160 L192 128" stroke="#5D4037" stroke-width="1" opacity="0.5"/>
    <path d="M128 180 L192 148" stroke="#5D4037" stroke-width="1" opacity="0.5"/>
    <path d="M128 200 L192 168" stroke="#5D4037" stroke-width="1" opacity="0.5"/>
    <path d="M128 220 L192 188" stroke="#5D4037" stroke-width="1" opacity="0.5"/>

    <!-- ROOF (Left Slope) -->
    <path d="M64 108 L128 140 L128 80 L64 48 Z" fill="#A52A2A" stroke="#800000" stroke-width="2"/>

    <!-- ROOF (Right Slope) -->
    <path d="M128 140 L192 108 L192 48 L128 80 Z" fill="#CD5C5C" stroke="#800000" stroke-width="2"/>
    
    <!-- ROOF TOP RIDGE -->
    <path d="M64 48 L128 80 L192 48 L128 16 Z" fill="#800000" stroke="#500000" stroke-width="2"/>

    <!-- LARGE BARN DOOR (Right Wall) -->
    <g transform="translate(140, 160)">
       <!-- Frame -->
       <path d="M0 0 L0 50 L30 35 L30 -15 Z" fill="#3E2723"/>
       <!-- Door Left -->
       <path d="M2 2 L2 48 L14 42 L14 8 Z" fill="#5D4037"/>
       <!-- Door Right -->
       <path d="M16 7 L16 41 L28 35 L28 13 Z" fill="#5D4037"/>
       <!-- X Brace -->
       <path d="M2 2 L14 42" stroke="#3E2723" stroke-width="1"/>
       <path d="M2 48 L14 8" stroke="#3E2723" stroke-width="1"/>
    </g>

    <!-- HAY LOFT WINDOW (Left Wall) -->
    <g transform="translate(85, 130)">
       <path d="M0 0 L0 25 L20 35 L20 10 Z" fill="#212121" stroke="#3E2723" stroke-width="2"/>
       <!-- Hay sticking out -->
       <path d="M5 25 L15 30 L10 35 Z" fill="#FDD835"/>
    </g>

  </g>
</svg>
