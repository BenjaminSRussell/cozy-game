<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Stone foundation -->
  <rect x="18" y="115" width="92" height="5" fill="#808080" stroke="#696969" stroke-width="1"/>
  
  <!-- Barn base -->
  <rect x="20" y="60" width="88" height="55" fill="#D2691E" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Wood planks texture -->
  <rect x="20" y="65" width="88" height="4" fill="#CD853F" opacity="0.7"/>
  <rect x="20" y="75" width="88" height="4" fill="#CD853F" opacity="0.7"/>
  <rect x="20" y="85" width="88" height="4" fill="#CD853F" opacity="0.7"/>
  <rect x="20" y="95" width="88" height="4" fill="#CD853F" opacity="0.7"/>
  <rect x="20" y="105" width="88" height="4" fill="#CD853F" opacity="0.7"/>
  
  <!-- Vertical wood beams -->
  <rect x="30" y="60" width="4" height="55" fill="#A0522D"/>
  <rect x="50" y="60" width="4" height="55" fill="#A0522D"/>
  <rect x="70" y="60" width="4" height="55" fill="#A0522D"/>
  <rect x="90" y="60" width="4" height="55" fill="#A0522D"/>
  
  <!-- Roof -->
  <polygon points="10,60 64,20 118,60" fill="#DC143C" stroke="#8B0000" stroke-width="2"/>
  
  <!-- Roof shingles -->
  <line x1="20" y1="50" x2="40" y2="35" stroke="#8B0000" stroke-width="1"/>
  <line x1="45" y1="28" x2="65" y2="18" stroke="#8B0000" stroke-width="1"/>
  <line x1="70" y1="23" x2="90" y2="38" stroke="#8B0000" stroke-width="1"/>
  
  <!-- Main door -->
  <rect x="50" y="85" width="28" height="30" fill="#654321" stroke="#4B2F20" stroke-width="2"/>
  <rect x="52" y="87" width="24" height="2" fill="#8B4513"/>
  <rect x="52" y="92" width="24" height="2" fill="#8B4513"/>
  <rect x="52" y="97" width="24" height="2" fill="#8B4513"/>
  <rect x="52" y="102" width="24" height="2" fill="#8B4513"/>
  <circle cx="70" cy="100" r="2" fill="#FFD700"/>
  
  <!-- Door handles -->
  <rect x="55" y="98" width="2" height="4" fill="#8B4513"/>
  <rect x="71" y="98" width="2" height="4" fill="#8B4513"/>
  
  <!-- Windows -->
  <rect x="30" y="70" width="12" height="12" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="36" y1="70" x2="36" y2="82" stroke="#4682B4" stroke-width="1"/>
  <line x1="30" y1="76" x2="42" y2="76" stroke="#4682B4" stroke-width="1"/>
  
  <rect x="86" y="70" width="12" height="12" fill="#87CEEB" stroke="#4682B4" stroke-width="2"/>
  <line x1="92" y1="70" x2="92" y2="82" stroke="#4682B4" stroke-width="1"/>
  <line x1="86" y1="76" x2="98" y2="76" stroke="#4682B4" stroke-width="1"/>
  
  <!-- Hay loft door -->
  <rect x="45" y="35" width="38" height="20" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  <line x1="64" y1="35" x2="64" y2="55" stroke="#654321" stroke-width="2"/>
  
  <!-- Loft door handles -->
  <circle cx="55" cy="45" r="1" fill="#654321"/>
  <circle cx="73" cy="45" r="1" fill="#654321"/>
  
  <!-- Hay sticking out -->
  <rect x="47" y="32" width="8" height="3" fill="#F4A460" opacity="0.8"/>
  <rect x="73" y="32" width="8" height="3" fill="#F4A460" opacity="0.8"/>
  
  <!-- Ventilation slots -->
  <rect x="25" y="50" width="2" height="8" fill="#654321"/>
  <rect x="35" y="50" width="2" height="8" fill="#654321"/>
  <rect x="91" y="50" width="2" height="8" fill="#654321"/>
  <rect x="101" y="50" width="2" height="8" fill="#654321"/>
</svg>
