<svg width="16" height="16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="snowGrad">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F0F8FF"/>
      <stop offset="100%" stop-color="#E6E6FA"/>
    </linearGradient>
  </defs>
  <!-- Snowflake crystal with hexagonal symmetry -->
  <g transform="translate(8, 8)">
    <!-- Main hexagonal structure -->
    <path d="M 0,-6 L 1.7,-3 L 0,0 L -1.7,-3 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M 1.7,-3 L 3.5,-1.7 L 2,0 L 0,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M 3.5,-1.7 L 3.5,1.7 L 2,0 L 2,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M 3.5,1.7 L 1.7,3 L 0,0 L 2,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M 1.7,3 L 0,6 L 0,0 L 0,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M 0,6 L -1.7,3 L 0,0 L 0,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M -1.7,3 L -3.5,1.7 L 0,0 L 0,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M -3.5,1.7 L -3.5,-1.7 L -2,0 L 0,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M -3.5,-1.7 L -1.7,-3 L 0,0 L -2,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    <path d="M -1.7,-3 L 0,-6 L 0,0 L 0,0 Z" fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.3"/>
    
    <!-- Six main arms extending from center -->
    <line x1="0" y1="0" x2="0" y2="-6" stroke="url(#snowGrad)" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="5.2" y2="-3" stroke="url(#snowGrad)" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="5.2" y2="3" stroke="url(#snowGrad)" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="url(#snowGrad)" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-5.2" y2="3" stroke="url(#snowGrad)" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="-5.2" y2="-3" stroke="url(#snowGrad)" stroke-width="1.2"/>
    
    <!-- Branches on each arm -->
    <!-- Top arm branches -->
    <line x1="0" y1="-2" x2="-1.5" y2="-3" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="0" y1="-2" x2="1.5" y2="-3" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="0" y1="-4" x2="-1" y2="-5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    <line x1="0" y1="-4" x2="1" y2="-5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    
    <!-- Upper-right arm branches -->
    <line x1="1.7" y1="-1" x2="1" y2="-2.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="1.7" y1="-1" x2="2.5" y2="-1.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="3.5" y1="-2" x2="3" y2="-3.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    <line x1="3.5" y1="-2" x2="4.5" y2="-2.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    
    <!-- Lower-right arm branches -->
    <line x1="1.7" y1="1" x2="1" y2="2.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="1.7" y1="1" x2="2.5" y2="1.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="3.5" y1="2" x2="3" y2="3.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    <line x1="3.5" y1="2" x2="4.5" y2="2.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    
    <!-- Bottom arm branches -->
    <line x1="0" y1="2" x2="-1.5" y2="3" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="0" y1="2" x2="1.5" y2="3" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="0" y1="4" x2="-1" y2="5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    <line x1="0" y1="4" x2="1" y2="5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    
    <!-- Lower-left arm branches -->
    <line x1="-1.7" y1="1" x2="-1" y2="2.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="-1.7" y1="1" x2="-2.5" y2="1.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="-3.5" y1="2" x2="-3" y2="3.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    <line x1="-3.5" y1="2" x2="-4.5" y2="2.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    
    <!-- Upper-left arm branches -->
    <line x1="-1.7" y1="-1" x2="-1" y2="-2.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="-1.7" y1="-1" x2="-2.5" y2="-1.5" stroke="url(#snowGrad)" stroke-width="0.8"/>
    <line x1="-3.5" y1="-2" x2="-3" y2="-3.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    <line x1="-3.5" y1="-2" x2="-4.5" y2="-2.5" stroke="url(#snowGrad)" stroke-width="0.6"/>
    
    <!-- Center hexagon -->
    <path d="M 0,-1 L 0.87,-0.5 L 0.87,0.5 L 0,1 L -0.87,0.5 L -0.87,-0.5 Z" 
          fill="url(#snowGrad)" stroke="#B0E0E6" stroke-width="0.5"/>
    
    <!-- Inner detail dots -->
    <circle cx="0" cy="0" r="0.3" fill="#FFFFFF"/>
    <circle cx="0" cy="-3" r="0.2" fill="#FFFFFF"/>
    <circle cx="2.6" cy="-1.5" r="0.2" fill="#FFFFFF"/>
    <circle cx="2.6" cy="1.5" r="0.2" fill="#FFFFFF"/>
    <circle cx="0" cy="3" r="0.2" fill="#FFFFFF"/>
    <circle cx="-2.6" cy="1.5" r="0.2" fill="#FFFFFF"/>
    <circle cx="-2.6" cy="-1.5" r="0.2" fill="#FFFFFF"/>
  </g>
</svg>
