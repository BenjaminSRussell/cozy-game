<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="snowCoverageGrad">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F0F8FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E6E6FA" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="snowBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>
  <!-- Snow coverage base -->
  <rect width="32" height="32" fill="url(#snowCoverageGrad)" filter="url(#snowBlur)"/>
  <!-- Snow drifts -->
  <ellipse cx="8" cy="20" rx="8" ry="4" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="24" cy="12" rx="6" ry="3" fill="#FFFFFF" opacity="0.7"/>
  <ellipse cx="16" cy="28" rx="10" ry="5" fill="#FFFFFF" opacity="0.6"/>
  <!-- Snow texture -->
  <circle cx="5" cy="5" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="12" cy="8" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="20" cy="6" r="1.2" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="28" cy="10" r="0.9" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="8" cy="15" r="0.7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="18" cy="18" r="1" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="25" cy="22" r="0.8" fill="#FFFFFF" opacity="0.5"/>
  <!-- Ice crystals -->
  <path d="M 10 25 L 11 23 L 12 25 L 11 27 Z" fill="#E0FFFF" opacity="0.7"/>
  <path d="M 22 15 L 23 13 L 24 15 L 23 17 Z" fill="#E0FFFF" opacity="0.6"/>
</svg>
