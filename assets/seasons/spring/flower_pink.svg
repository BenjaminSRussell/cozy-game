<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pinkFlowerGrad">
      <stop offset="0%" stop-color="#FFB6C1"/>
      <stop offset="70%" stop-color="#FF69B4"/>
      <stop offset="100%" stop-color="#FF1493"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  
  <!-- Stem -->
  <rect x="15" y="20" width="2" height="12" fill="#228B22" rx="1"/>
  
  <!-- Leaves -->
  <ellipse cx="12" cy="24" rx="3" ry="1.5" fill="#32CD32" transform="rotate(-30 12 24)"/>
  <ellipse cx="20" cy="26" rx="3" ry="1.5" fill="#32CD32" transform="rotate(30 20 26)"/>
  
  <!-- Flower petals with animation -->
  <g transform="translate(16, 16)">
    <!-- Center -->
    <circle cx="0" cy="0" r="3" fill="#FFD700" filter="url(#softGlow)"/>
    
    <!-- Petals arranged in circle -->
    <ellipse cx="0" cy="-6" rx="2.5" ry="4" fill="url(#pinkFlowerGrad)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="4" fill="url(#pinkFlowerGrad)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="4" fill="url(#pinkFlowerGrad)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="4" fill="url(#pinkFlowerGrad)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="4" fill="url(#pinkFlowerGrad)" transform="rotate(288)"/>
    
    <!-- Petal details -->
    <circle cx="0" cy="-4" r="0.5" fill="#FFC0CB" opacity="0.7" transform="rotate(0)"/>
    <circle cx="0" cy="-4" r="0.5" fill="#FFC0CB" opacity="0.7" transform="rotate(72)"/>
    <circle cx="0" cy="-4" r="0.5" fill="#FFC0CB" opacity="0.7" transform="rotate(144)"/>
    <circle cx="0" cy="-4" r="0.5" fill="#FFC0CB" opacity="0.7" transform="rotate(216)"/>
    <circle cx="0" cy="-4" r="0.5" fill="#FFC0CB" opacity="0.7" transform="rotate(288)"/>
  </g>
  
  <!-- Subtle sparkle -->
  <circle cx="18" cy="12" r="0.5" fill="#FFFFFF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
