<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="redFlowerGrad">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="70%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#DC143C"/>
    </radialGradient>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>
  
  <!-- Stem -->
  <rect x="15" y="20" width="2" height="12" fill="#228B22" rx="1"/>
  
  <!-- Leaves -->
  <ellipse cx="12" cy="24" rx="3" ry="1.5" fill="#32CD32" transform="rotate(-30 12 24)"/>
  <ellipse cx="20" cy="26" rx="3" ry="1.5" fill="#32CD32" transform="rotate(30 20 26)"/>
  
  <!-- Rose-like flower petals -->
  <g transform="translate(16, 16)">
    <!-- Center -->
    <circle cx="0" cy="0" r="2.5" fill="#8B0000" filter="url(#redGlow)"/>
    
    <!-- Inner petals -->
    <ellipse cx="0" cy="-4" rx="2" ry="3" fill="url(#redFlowerGrad)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3" fill="url(#redFlowerGrad)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-4" rx="2" ry="3" fill="url(#redFlowerGrad)" transform="rotate(240)"/>
    
    <!-- Outer petals -->
    <ellipse cx="0" cy="-6" rx="2.5" ry="3.5" fill="url(#redFlowerGrad)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="3.5" fill="url(#redFlowerGrad)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-6" rx="2.5" ry="3.5" fill="url(#redFlowerGrad)" transform="rotate(300)"/>
    
    <!-- Petal highlights -->
    <circle cx="0" cy="-3" r="0.3" fill="#FFB6C1" opacity="0.8" transform="rotate(0)"/>
    <circle cx="0" cy="-3" r="0.3" fill="#FFB6C1" opacity="0.8" transform="rotate(120)"/>
    <circle cx="0" cy="-3" r="0.3" fill="#FFB6C1" opacity="0.8" transform="rotate(240)"/>
  </g>
  
  <!-- Dew drop -->
  <ellipse cx="19" cy="14" rx="0.8" ry="1" fill="#87CEEB" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" repeatCount="indefinite"/>
  </ellipse>
</svg>
