<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFA500" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6347" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="heatBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.5"/>
    </filter>
  </defs>
  <!-- Heat wave effect -->
  <rect width="32" height="32" fill="url(#heatGrad)" filter="url(#heatBlur)"/>
  <!-- Shimmer lines -->
  <path d="M 5 8 Q 15 6 25 8" stroke="#FFD700" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 3 16 Q 16 14 29 16" stroke="#FFA500" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 7 24 Q 20 22 27 24" stroke="#FF6347" stroke-width="1" fill="none" opacity="0.3"/>
  <!-- Hot spots -->
  <circle cx="8" cy="8" r="3" fill="#FFD700" opacity="0.2"/>
  <circle cx="24" cy="16" r="4" fill="#FFA500" opacity="0.2"/>
  <circle cx="16" cy="24" r="3" fill="#FF6347" opacity="0.2"/>
</svg>
