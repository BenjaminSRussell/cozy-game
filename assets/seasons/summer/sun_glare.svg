<svg width="32" height="32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sunGrad">
      <stop offset="0%" stop-color="#FFFACD" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#FFD700" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FFA500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <!-- Sun glare effect -->
  <rect width="32" height="32" fill="url(#sunGrad)"/>
  <!-- Sun rays -->
  <g transform="translate(16, 16)">
    <path d="M 0 -15 L 2 -10 L 0 -8 L -2 -10 Z" fill="#FFD700" opacity="0.6"/>
    <path d="M 15 0 L 10 2 L 8 0 L 10 -2 Z" fill="#FFD700" opacity="0.6"/>
    <path d="M 0 15 L -2 10 L 0 8 L 2 10 Z" fill="#FFD700" opacity="0.6"/>
    <path d="M -15 0 L -10 -2 L -8 0 L -10 2 Z" fill="#FFD700" opacity="0.6"/>
    <!-- Diagonal rays -->
    <path d="M 10 -10 L 8 -6 L 6 -8 L 8 -10 Z" fill="#FFA500" opacity="0.4"/>
    <path d="M 10 10 L 6 8 L 8 6 L 10 8 Z" fill="#FFA500" opacity="0.4"/>
    <path d="M -10 10 L -8 6 L -6 8 L -8 10 Z" fill="#FFA500" opacity="0.4"/>
    <path d="M -10 -10 L -6 -8 L -8 -6 L -10 -8 Z" fill="#FFA500" opacity="0.4"/>
  </g>
  <!-- Bright center -->
  <circle cx="16" cy="16" r="5" fill="#FFFACD" opacity="0.7"/>
  <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.5"/>
</svg>
