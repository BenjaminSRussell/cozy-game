<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep water gradient -->
    <linearGradient id="deepGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4682B4;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#1E90FF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:1" />
    </linearGradient>
    
    <!-- Deep water current pattern -->
    <pattern id="currentPattern" x="0" y="0" width="30" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q15,5 30,10" stroke="#191970" stroke-width="2" fill="none" opacity="0.3"/>
      <path d="M0,15 Q15,10 30,15" stroke="#000080" stroke-width="1.5" fill="none" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Deep water base -->
  <rect width="40" height="40" fill="url(#deepGradient)"/>
  
  <!-- Current overlay -->
  <rect width="40" height="40" fill="url(#currentPattern)"/>
  
  <!-- Dark surface waves -->
  <path d="M0,8 Q10,5 20,8 T40,8" stroke="#191970" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M0,15 Q10,12 20,15 T40,15" stroke="#000080" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M0,25 Q10,22 20,25 T40,25" stroke="#191970" stroke-width="1.2" fill="none" opacity="0.4"/>
  
  <!-- Minimal light penetration -->
  <ellipse cx="20" cy="5" rx="12" ry="2" fill="#87CEEB" opacity="0.2"/>
  
  <!-- Deep shadows -->
  <rect x="0" y="30" width="40" height="10" fill="#000080" opacity="0.6"/>
  <rect x="0" y="35" width="40" height="5" fill="#00008B" opacity="0.8"/>
</svg>
