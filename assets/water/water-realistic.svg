<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Water gradient for depth -->
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#4682B4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1E90FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ripple pattern -->
    <pattern id="ripplePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="none" stroke="#B0E0E6" stroke-width="0.5" opacity="0.6"/>
      <circle cx="5" cy="5" r="2" fill="none" stroke="#ADD8E6" stroke-width="0.5" opacity="0.4"/>
      <circle cx="15" cy="15" r="2.5" fill="none" stroke="#87CEEB" stroke-width="0.5" opacity="0.5"/>
    </pattern>
    
    <!-- Wave pattern -->
    <pattern id="wavePattern" x="0" y="0" width="40" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 Q10,2 20,5 T40,5" stroke="#5F9EA0" stroke-width="1" fill="none" opacity="0.4"/>
      <path d="M0,8 Q10,5 20,8 T40,8" stroke="#4682B4" stroke-width="0.8" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Base water with gradient -->
  <rect width="40" height="40" fill="url(#waterGradient)"/>
  
  <!-- Wave overlay -->
  <rect width="40" height="40" fill="url(#wavePattern)"/>
  
  <!-- Ripple overlay -->
  <rect width="40" height="40" fill="url(#ripplePattern)"/>
  
  <!-- Surface reflection -->
  <ellipse cx="20" cy="10" rx="15" ry="3" fill="#B0E0E6" opacity="0.3"/>
  <ellipse cx="10" cy="15" rx="8" ry="2" fill="#ADD8E6" opacity="0.2"/>
  <ellipse cx="30" cy="12" rx="10" ry="2.5" fill="#87CEEB" opacity="0.25"/>
  
  <!-- Depth shading -->
  <rect x="0" y="30" width="40" height="10" fill="#1E90FF" opacity="0.4"/>
  <rect x="0" y="35" width="40" height="5" fill="#00008B" opacity="0.3"/>
  
  <!-- Animated bubbles -->
  <circle cx="8" cy="25" r="1" fill="#E0FFFF" opacity="0.6">
    <animate attributeName="cy" values="25;15;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="25" cy="30" r="0.8" fill="#F0FFFF" opacity="0.5">
    <animate attributeName="cy" values="30;20;30" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="28" r="1.2" fill="#E0FFFF" opacity="0.4">
    <animate attributeName="cy" values="28;18;28" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
