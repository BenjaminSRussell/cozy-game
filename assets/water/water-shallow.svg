<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shallow water gradient -->
    <linearGradient id="shallowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0E0E6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#87CEEB;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Sandy bottom pattern -->
    <pattern id="sandPattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4E4C1" opacity="0.6"/>
      <circle cx="8" cy="8" r="1.5" fill="#E6D4A3" opacity="0.5"/>
      <circle cx="5" cy="7" r="1" fill="#D2B48C" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Sandy bottom -->
  <rect width="40" height="40" fill="url(#sandPattern)"/>
  
  <!-- Shallow water layer -->
  <rect width="40" height="40" fill="url(#shallowGradient)"/>
  
  <!-- Gentle ripples -->
  <path d="M0,10 Q10,8 20,10 T40,10" stroke="#ADD8E6" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M0,20 Q10,18 20,20 T40,20" stroke="#87CEEB" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M0,30 Q10,28 20,30 T40,30" stroke="#B0E0E6" stroke-width="1" fill="none" opacity="0.3"/>
  
  <!-- Light reflections -->
  <ellipse cx="15" cy="8" rx="8" ry="2" fill="#E0FFFF" opacity="0.4"/>
  <ellipse cx="25" cy="25" rx="6" ry="1.5" fill="#F0FFFF" opacity="0.3"/>
</svg>
