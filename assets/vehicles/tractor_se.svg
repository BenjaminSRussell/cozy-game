<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- ISOMETRIC TRACTOR | SE Orientation | 2:1 Projection -->
  <defs>
    <linearGradient id="premiumRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="40%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="chromeFinish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#90A4AE"/>
      <stop offset="51%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#CFD8DC"/>
    </linearGradient>
    <linearGradient id="glassGlance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#81D4FA" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0288D1" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="tireRubber" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(128, 160)">
    <path d="M-60,10 L0,40 L60,10 L0,-20 Z" fill="#000000" opacity="0.3" filter="url(#softShadow)" transform="translate(0, 10) scale(1, 0.5)"/>

    <!-- Rear Wheels (Back) -->
    <g transform="translate(-45, 0)">
       <ellipse cx="-20" cy="-5" rx="15" ry="25" fill="url(#tireRubber)" transform="rotate(-15)"/>
       <ellipse cx="-20" cy="-5" rx="8" ry="12" fill="#FFC107" transform="rotate(-15)"/>
    </g>
    <g transform="translate(45, 0)">
       <ellipse cx="-20" cy="-5" rx="15" ry="25" fill="url(#tireRubber)" transform="rotate(-15)"/>
       <ellipse cx="-20" cy="-5" rx="8" ry="12" fill="#FFC107" transform="rotate(-15)"/>
    </g>

    <!-- Chassis -->
    <g transform="translate(0, -10)">
       <path d="M-20,0 L20,20 L20,-30 L-20,-50 Z" fill="#B71C1C"/>
       <path d="M-20,-50 L20,-30 L0,-40 L-40,-60 Z" fill="#FF5252"/>
       <path d="M-40,-60 L0,-40 L0,10 L-40,-10 Z" fill="url(#premiumRed)"/>
       <!-- Grille -->
       <path d="M-38,-15 L-2,-5 L-2,-35 L-38,-45 Z" fill="#263238" opacity="0.8"/>
       <line x1="-38" y1="-40" x2="-2" y2="-10" stroke="#CFD8DC" stroke-width="1"/>
       <line x1="-38" y1="-35" x2="-2" y2="-5" stroke="#CFD8DC" stroke-width="1"/>
    </g>

    <!-- Cabin -->
    <g transform="translate(10, -40)">
       <path d="M-30,0 L10,20 L50,0 L10,-20 Z" fill="#455A64"/>
       <path d="M-25,-55 L5,-65 L5,-15 L-25,-5 Z" fill="url(#glassGlance)"/> <!-- Windshield -->
       <path d="M5,-65 L45,-55 L45,-5 L5,-15 Z" fill="url(#glassGlance)" opacity="0.8"/> <!-- Side -->
       <path d="M-30,-60 L10,-40 L50,-60 L10,-80 Z" fill="#E53935"/> <!-- Roof -->
    </g>

    <!-- Front Wheels -->
    <g transform="translate(-30, 25)">
       <ellipse cx="0" cy="0" rx="10" ry="16" fill="url(#tireRubber)" transform="rotate(-15)"/>
    </g>
    <g transform="translate(10, 45)">
       <ellipse cx="0" cy="0" rx="10" ry="16" fill="url(#tireRubber)" transform="rotate(-15)"/>
    </g>

    <!-- Exhaust -->
    <rect x="-10" y="-80" width="4" height="30" fill="url(#chromeFinish)" transform="translate(-10, 0)"/>
  </g>
</svg>
