<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- ISOMETRIC TRACTOR | NE Orientation | Rear View -->
  <defs>
    <linearGradient id="premiumRedBack" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
  </defs>

  <g transform="translate(128, 160)">
    <!-- Shadow -->
    <path d="M-60,10 L0,40 L60,10 L0,-20 Z" fill="#000000" opacity="0.3" transform="translate(0, 5) scale(1, 0.5)"/>

    <!-- Front Wheels (Far) -->
    <g transform="translate(-10, -45)" opacity="0.8">
       <ellipse cx="0" cy="0" rx="10" ry="16" fill="#111" transform="rotate(-15)"/>
    </g>

    <!-- Chassis (Showing back) -->
    <g transform="translate(0, -10)">
       <path d="M-40,-10 L0,10 L0,-40 L-40,-60 Z" fill="#8B0000"/> <!-- Back panel -->
       <path d="M0,10 L40,-10 L40,-60 L0,-40 Z" fill="#B71C1C"/> <!-- Side -->
       <path d="M-40,-60 L0,-40 L40,-60 L0,-80 Z" fill="#FF5252"/> <!-- Top -->
    </g>

    <!-- Cabin (Showing back) -->
    <g transform="translate(-10, -50)">
       <path d="M-40,0 L0,20 L40,0 L0,-20 Z" fill="#455A64"/> <!-- Floor -->
       <path d="M-35,-5 L-35,-55" stroke="#37474F" stroke-width="4"/> <!-- Rear pillar -->
       <path d="M35,-5 L35,-55" stroke="#37474F" stroke-width="4"/> <!-- Rear pillar -->
       <path d="M-40,-60 L0,-40 L40,-60 L0,-80 Z" fill="#E53935"/> <!-- Roof -->
    </g>

    <!-- Rear Wheels (Front-most in this view) -->
    <g transform="translate(-40, 10)">
       <ellipse cx="20" cy="0" rx="15" ry="25" fill="#212121" transform="rotate(-15)"/>
       <ellipse cx="20" cy="0" rx="8" ry="12" fill="#FFC107" transform="rotate(-15)"/>
    </g>
    <g transform="translate(10, -10)">
       <ellipse cx="20" cy="0" rx="15" ry="25" fill="#212121" transform="rotate(-15)"/>
       <ellipse cx="20" cy="0" rx="8" ry="12" fill="#FFC107" transform="rotate(-15)"/>
    </g>
  </g>
</svg>
