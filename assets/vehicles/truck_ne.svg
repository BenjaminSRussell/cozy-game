<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- ISOMETRIC TRUCK | NE Orientation (Rear) | CORRECTED 2:1 -->
  <defs>
    <linearGradient id="truckBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(128, 128) scale(-1, 1)">
    <!-- Shadow -->
    <path d="M0,45 L-70,10 L0,-25 L70,10 Z" fill="#000000" opacity="0.3" filter="url(#softShadow)" transform="translate(0, 30)"/>

    <!-- CABIN (Front/Right, mostly hidden) -->
    <g transform="translate(45, -5)"> 
       <!-- Just the side peeking out -->
       <path d="M0,0 L20,-10 L20,20 L0,30 Z" fill="#1565C0"/>
    </g>

    <!-- TRUCK BED (Rear View - Dominant) -->
    <g transform="translate(-10, 0)">
      <!-- Rear Tailgate -->
      <path d="M-40,0 L0,20 L40,0 L0,-20 Z" fill="#5D4037"/> <!-- Floor Underside? No, Tailgate face -->
      
      <!-- Better Rear Box -->
      <!-- Left Side -->
      <path d="M-40,0 L0,-20 L0,-40 L-40,-20 Z" fill="#1565C0"/>
      <!-- Right Side (Tailgate) -->
      <path d="M0,20 L40,0 L40,-20 L0,0 Z" fill="#1976D2"/>
      
      <!-- Bed Cover/Top Edge -->
      <path d="M-40,-20 L0,-40 L40,-20 L0,0 Z" fill="#4E342E"/>

      <!-- Tail Lights -->
      <rect x="35" y="-10" width="4" height="8" fill="#D32F2F" transform="skewY(-26)"/>
    </g>

    <!-- WHEELS -->
    <g transform="translate(-30, 25)">
      <ellipse cx="0" cy="0" rx="10" ry="16" fill="#111"/>
    </g>
    <g transform="translate(40, -10)">
      <ellipse cx="0" cy="0" rx="10" ry="16" fill="#111"/>
    </g>
  </g>
</svg>
