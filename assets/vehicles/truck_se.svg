<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- ISOMETRIC TRUCK | SE Orientation | CORRECTED 2:1 -->
  <defs>
    <linearGradient id="truckBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(128, 128)">
    <!-- Shadow -->
    <path d="M0,45 L-70,10 L0,-25 L70,10 Z" fill="#000000" opacity="0.3" filter="url(#softShadow)" transform="translate(0, 30)"/>

    <!-- TRUCK BED (Back) -->
    <g transform="translate(-30, -10)">
      <!-- Left side -->
      <path d="M-40,-20 L0,0 L0,30 L-40,10 Z" fill="#1565C0"/>
      <!-- Top (Inside bed) -->
      <path d="M-35,-15 L35,-35 L75,-15 L5,5 Z" fill="#4E342E"/> <!-- Dark wood floor -->
      <!-- Side Walls -->
      <path d="M-40,-20 L0,0 L0,8 L-40,-12 Z" fill="#8D6E63"/> <!-- Left Wall -->
    </g>

    <!-- CABIN (Front) -->
    <g transform="translate(20, 10)">
       <!-- Front Grille Block -->
       <path d="M0,0 L40,-20 L40,10 L0,30 Z" fill="#1976D2"/>
       
       <!-- Grill details -->
       <path d="M5,5 L35,-10 L35,5 L5,20 Z" fill="#CFD8DC"/>
       <path d="M5,5 L35,-10" stroke="#90A4AE" stroke-width="2"/>
       <path d="M5,10 L35,-5" stroke="#90A4AE" stroke-width="2"/>
       
       <!-- Left Side -->
       <path d="M-20,-10 L0,0 L0,30 L-20,20 Z" fill="#1565C0"/>
       
       <!-- Roof -->
       <path d="M-20,-10 L20,-30 L60,-10 L20,10 Z" fill="#2196F3"/>
       
       <!-- Windshield -->
       <path d="M2,2 L38,-16 L38,-2 L2,16 Z" fill="#B3E5FC" opacity="0.8"/>
    </g>

    <!-- WHEELS -->
    <g transform="translate(-50, 20)">
      <ellipse cx="0" cy="0" rx="10" ry="16" fill="#111"/>
      <ellipse cx="0" cy="0" rx="4" ry="6" fill="#DDD"/>
    </g>
    <g transform="translate(0, 45)">
      <ellipse cx="0" cy="0" rx="10" ry="16" fill="#111"/>
      <ellipse cx="0" cy="0" rx="4" ry="6" fill="#DDD"/>
    </g>
    <g transform="translate(50, 20)">
      <ellipse cx="0" cy="0" rx="10" ry="16" fill="#111"/>
      <ellipse cx="0" cy="0" rx="4" ry="6" fill="#DDD"/>
    </g>
  </g>
</svg>
