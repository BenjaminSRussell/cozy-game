<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hoeHandleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="hoeBladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#696969"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#4B4B4B"/>
    </linearGradient>
    <filter id="hoeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#hoeShadow)">
    <!-- Handle -->
    <rect x="30" y="8" width="4" height="36" fill="url(#hoeHandleGrad)" rx="2"/>
    
    <!-- Handle grip -->
    <rect x="28" y="8" width="8" height="6" fill="#654321" rx="3"/>
    <rect x="26" y="10" width="12" height="4" fill="#8B4513" rx="2"/>
    
    <!-- Connection collar -->
    <rect x="28" y="42" width="8" height="3" fill="#696969" rx="1"/>
    
    <!-- Hoe blade - L-shaped -->
    <path d="M 20 44 L 44 44 L 44 52 L 24 52 L 24 48 L 20 48 Z" fill="url(#hoeBladeGrad)"/>
    
    <!-- Blade edge -->
    <rect x="21" y="46" width="3" height="2" fill="#4B4B4B"/>
    <rect x="25" y="50" width="18" height="2" fill="#4B4B4B"/>
    
    <!-- Metal shine -->
    <rect x="22" y="47" width="1" height="1" fill="#A9A9A9" opacity="0.7"/>
    <rect x="26" y="51" width="16" height="1" fill="#A9A9A9" opacity="0.7"/>
    
    <!-- Wood grain -->
    <line x1="32" y1="12" x2="32" y2="40" stroke="#654321" stroke-width="1" opacity="0.6"/>
    <line x1="33" y1="16" x2="33" y2="32" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Rivet -->
    <circle cx="32" cy="43" r="1" fill="#4B4B4B"/>
  </g>
</svg>
