  <rect x="4" y="16" width="16" height="3" fill="url(#rakeHeadGrad)" rx="1"/>
  <!-- Tines -->
  <rect x="5" y="19" width="1.5" height="3" fill="#696969"/>
  <rect x="7.5" y="19" width="1.5" height="3" fill="#696969"/>
  <rect x="10" y="19" width="1.5" height="3" fill="#696969"/>
  <rect x="12.5" y="19" width="1.5" height="3" fill="#696969"/>
  <rect x="15" y="19" width="1.5" height="3" fill="#696969"/>
  <rect x="17.5" y="19" width="1.5" height="3" fill="#696969"/>
  <!-- Tine tips -->
  <ellipse cx="5.75" cy="22" rx="0.8" ry="0.5" fill="#4B4B4B"/>
  <ellipse cx="8.25" cy="22" rx="0.8" ry="0.5" fill="#4B4B4B"/>
  <ellipse cx="10.75" cy="22" rx="0.8" ry="0.5" fill="#4B4B4B"/>
  <ellipse cx="13.25" cy="22" rx="0.8" ry="0.5" fill="#4B4B4B"/>
  <ellipse cx="15.75" cy="22" rx="0.8" ry="0.5" fill="#4B4B4B"/>
  <ellipse cx="18.25" cy="22" rx="0.8" ry="0.5" fill="#4B4B4B"/>
  <!-- Wood grain details -->
  <line x1="11.5" y1="4" x2="11.5" y2="14" stroke="#654321" stroke-width="0.5" opacity="0.6"/>
  <line x1="12" y1="6" x2="12" y2="12" stroke="#654321" stroke-width="0.3" opacity="0.4"/>
