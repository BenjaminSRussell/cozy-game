<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rakeHandleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="rakeHeadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#696969"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#4B4B4B"/>
    </linearGradient>
    <filter id="rakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#rakeShadow)">
    <!-- Handle -->
    <rect x="30" y="8" width="4" height="40" fill="url(#rakeHandleGrad)" rx="2"/>
    
    <!-- Handle grip -->
    <rect x="28" y="8" width="8" height="6" fill="#654321" rx="3"/>
    <rect x="26" y="10" width="12" height="4" fill="#8B4513" rx="2"/>
    
    <!-- Rake head -->
    <rect x="12" y="44" width="40" height="6" fill="url(#rakeHeadGrad)" rx="2"/>
    
    <!-- Tines -->
    <rect x="14" y="50" width="3" height="8" fill="#696969" rx="1"/>
    <rect x="19" y="50" width="3" height="8" fill="#696969" rx="1"/>
    <rect x="24" y="50" width="3" height="8" fill="#696969" rx="1"/>
    <rect x="29" y="50" width="3" height="8" fill="#696969" rx="1"/>
    <rect x="34" y="50" width="3" height="8" fill="#696969" rx="1"/>
    <rect x="39" y="50" width="3" height="8" fill="#696969" rx="1"/>
    <rect x="44" y="50" width="3" height="8" fill="#696969" rx="1"/>
    
    <!-- Tine tips -->
    <ellipse cx="15.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    <ellipse cx="20.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    <ellipse cx="25.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    <ellipse cx="30.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    <ellipse cx="35.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    <ellipse cx="40.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    <ellipse cx="45.5" cy="58" rx="1.5" ry="1" fill="#4B4B4B"/>
    
    <!-- Wood grain details -->
    <line x1="32" y1="12" x2="32" y2="40" stroke="#654321" stroke-width="1" opacity="0.6"/>
    <line x1="33" y1="16" x2="33" y2="32" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Metal shine -->
    <rect x="16" y="46" width="32" height="1" fill="#A9A9A9" opacity="0.7"/>
  </g>
</svg>
