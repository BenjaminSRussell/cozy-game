<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scytheHandleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="scytheBladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#696969"/>
    </linearGradient>
    <filter id="scytheShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#scytheShadow)">
    <!-- Curved handle -->
    <path d="M 32 56 Q 20 40 16 20 Q 14 8 20 8 Q 26 8 32 20 Q 40 36 48 56" 
          fill="url(#scytheHandleGrad)" 
          stroke="#654321" 
          stroke-width="1"/>
    
    <!-- Handle grip area -->
    <ellipse cx="32" cy="48" rx="4" ry="8" fill="#654321" opacity="0.8"/>
    
    <!-- Blade connection -->
    <rect x="14" y="16" width="12" height="4" fill="#696969" rx="2"/>
    
    <!-- Curved blade -->
    <path d="M 8 12 Q 4 16 4 24 Q 4 32 8 36 L 20 28 Q 16 24 16 20 Q 16 16 12 12 Z" 
          fill="url(#scytheBladeGrad)" 
          stroke="#4B4B4B" 
          stroke-width="1"/>
    
    <!-- Blade edge -->
    <path d="M 6 14 Q 4 18 4 24 Q 4 30 6 34" 
          fill="none" 
          stroke="#2C3E50" 
          stroke-width="2" 
          stroke-linecap="round"/>
    
    <!-- Blade shine -->
    <path d="M 10 16 Q 8 20 8 26 Q 8 30 10 32 L 12 30 Q 10 26 10 22 Q 10 18 12 16 Z" 
          fill="#E5E5E5" 
          opacity="0.4"/>
    
    <!-- Wood grain -->
    <line x1="28" y1="24" x2="36" y2="48" stroke="#654321" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="20" x2="34" y2="40" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Rivets -->
    <circle cx="16" cy="18" r="1" fill="#4B4B4B"/>
    <circle cx="20" cy="18" r="1" fill="#4B4B4B"/>
  </g>
</svg>
