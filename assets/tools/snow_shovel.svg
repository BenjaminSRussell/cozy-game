<svg width="24" height="20" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shovelHandleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="shovelBladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#696969"/>
    </linearGradient>
    <radialGradient id="shovelGripGrad">
      <stop offset="0%" stop-color="#654321"/>
      <stop offset="100%" stop-color="#4B2F20"/>
    </radialGradient>
  </defs>
  <!-- Handle -->
  <rect x="11" y="2" width="2" height="12" fill="url(#shovelHandleGrad)" rx="1"/>
  <!-- D-grip -->
  <rect x="8" y="2" width="8" height="4" fill="url(#shovelGripGrad)" rx="2"/>
  <rect x="9" y="3" width="6" height="2" fill="#8B4513" rx="1"/>
  <!-- Connection collar -->
  <rect x="10" y="13" width="4" height="2" fill="#696969" rx="1"/>
  <rect x="10.5" y="13.5" width="3" height="1" fill="#808080" rx="0.5"/>
  <!-- Shovel blade -->
  <path d="M 6 15 L 18 15 L 16 20 L 8 20 Z" fill="url(#shovelBladeGrad)"/>
  <!-- Blade edge -->
  <rect x="7" y="19.5" width="10" height="1" fill="#4B4B4B"/>
  <!-- Blade reinforcement line -->
  <rect x="11" y="16" width="2" height="3" fill="#696969" opacity="0.8"/>
  <!-- Metal shine effect -->
  <path d="M 8 16 L 16 16 L 15 18 L 9 18 Z" fill="#E5E5E5" opacity="0.4"/>
  <!-- Wood grain on handle -->
  <line x1="11.5" y1="4" x2="11.5" y2="11" stroke="#654321" stroke-width="0.5" opacity="0.6"/>
  <line x1="12" y1="6" x2="12" y2="9" stroke="#654321" stroke-width="0.3" opacity="0.4"/>
  <!-- Rivets -->
  <circle cx="9" cy="14" r="0.3" fill="#4B4B4B"/>
  <circle cx="15" cy="14" r="0.3" fill="#4B4B4B"/>
  <!-- Snow texture hint on blade -->
  <rect x="9" y="17" width="6" height="2" fill="#FFFFFF" opacity="0.2" rx="1"/>
</svg>
