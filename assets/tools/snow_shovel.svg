<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shovelHandleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#A0522D"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    <linearGradient id="shovelBladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#696969"/>
    </linearGradient>
    <radialGradient id="shovelGripGrad">
      <stop offset="0%" stop-color="#654321"/>
      <stop offset="100%" stop-color="#4B2F20"/>
    </radialGradient>
    <filter id="shovelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shovelShadow)">
    <!-- Handle -->
    <rect x="30" y="8" width="4" height="32" fill="url(#shovelHandleGrad)" rx="2"/>
    
    <!-- D-grip -->
    <rect x="24" y="8" width="16" height="8" fill="url(#shovelGripGrad)" rx="4"/>
    <rect x="26" y="10" width="12" height="4" fill="#8B4513" rx="2"/>
    
    <!-- Connection collar -->
    <rect x="28" y="38" width="8" height="4" fill="#696969" rx="2"/>
    <rect x="29" y="39" width="6" height="2" fill="#808080" rx="1"/>
    
    <!-- Shovel blade -->
    <path d="M 16 42 L 48 42 L 44 58 L 20 58 Z" fill="url(#shovelBladeGrad)"/>
    
    <!-- Blade edge -->
    <rect x="22" y="56" width="20" height="2" fill="#4B4B4B"/>
    
    <!-- Blade reinforcement line -->
    <rect x="31" y="44" width="2" height="6" fill="#696969" opacity="0.8"/>
    
    <!-- Metal shine effect -->
    <path d="M 20 44 L 44 44 L 42 48 L 22 48 Z" fill="#E5E5E5" opacity="0.4"/>
    
    <!-- Wood grain on handle -->
    <line x1="32" y1="12" x2="32" y2="36" stroke="#654321" stroke-width="1" opacity="0.6"/>
    <line x1="33" y1="16" x2="33" y2="28" stroke="#654321" stroke-width="0.5" opacity="0.4"/>
    
    <!-- Rivets -->
    <circle cx="26" cy="40" r="1" fill="#4B4B4B"/>
    <circle cx="38" cy="40" r="1" fill="#4B4B4B"/>
    
    <!-- Snow texture hint on blade -->
    <rect x="24" y="48" width="16" height="4" fill="#FFFFFF" opacity="0.2" rx="2"/>
  </g>
</svg>
