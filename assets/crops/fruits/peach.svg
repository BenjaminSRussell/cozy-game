<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Peach Smooth Gradient (Fuzzy feel) -->
    <radialGradient id="peachGrad" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FFB7B2" />   <!-- Soft Pink Highlight -->
      <stop offset="50%" stop-color="#FF9F43" />   <!-- Warm Peach Orange -->
      <stop offset="100%" stop-color="#E55039" /> <!-- Deep Blush Red -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowPeach" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#6D214F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowPeach)">
    <!-- Peach Body: Heart-ish shape but very rounded/squishy -->
    <!-- The cleft is essential for a peach -->
    <path d="M32 16 C32 16 38 10 46 12 C54 14 58 24 58 36 C58 50 48 56 32 58 C16 56 6 50 6 36 C6 24 10 14 18 12 C26 10 32 16 32 16"
          fill="url(#peachGrad)"
          stroke="#B33771"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round"/>
          
    <!-- The Cleft Line -->
    <path d="M32 16 Q32 25 32 35"
          fill="none"
          stroke="#B33771"
          stroke-width="1.5"
          stroke-linecap="round"
          opacity="0.6"/>

    <!-- Stem -->
    <path d="M32 16 Q30 10 28 8" 
          fill="none" 
          stroke="#5D4037" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Leaf -->
    <path d="M32 12 Q42 8 44 14 Q42 20 34 18" 
          fill="#58B19F" 
          stroke="#1B5E20" 
          stroke-width="1.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- Kindchenschema Face -->
  <!-- Peaches are sweet, so maybe a tiny rosy cheek? -->
  <g fill="#4A0E0E">
    <circle cx="24" cy="38" r="2" />
    <circle cx="40" cy="38" r="2" />
    <path d="M29 42 Q32 44 35 42" fill="none" stroke="#4A0E0E" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <!-- Blush Cheeks -->
  <g fill="#E55039" opacity="0.4">
    <circle cx="18" cy="40" r="3.5" />
    <circle cx="46" cy="40" r="3.5" />
  </g>

  <!-- Surface Highlight (Soft, satin finish) -->
  <ellipse cx="20" cy="22" rx="4" ry="2.5" fill="white" fill-opacity="0.25" transform="rotate(-20 20 22)" />
</svg>
