<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Apple Gradient -->
    <radialGradient id="appleGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#D63031" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#5D1515" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#appleShadow)">
    <!-- Apple Body - Distinctive round shape with indentation -->
    <path d="M32 48 C24 48 16 44 16 32 C16 20 24 12 32 12 C40 12 48 20 48 32 C48 44 40 48 32 48 Z"
          fill="url(#appleGrad)" 
          stroke="#8E1C1C" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Stem - Short and brown -->
    <line x1="32" y1="12" x2="32" y2="8" 
          stroke="#5D3A1A" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Leaf - Single small leaf -->
    <ellipse cx="36" cy="10" rx="4" ry="2" 
             fill="#44BD32" 
             stroke="#2D5A27" 
             stroke-width="1" 
             transform="rotate(30 36 10)" />
  </g>

  <!-- Simple face - Minimal and cute -->
  <g fill="#2D0B0B">
    <circle cx="27" cy="30" r="1.5" />
    <circle cx="37" cy="30" r="1.5" />
    <path d="M30 36 Q32 38 34 36" 
          fill="none" 
          stroke="#2D0B0B" 
          stroke-width="1.2" 
          stroke-linecap="round" />
  </g>

  <!-- Single highlight -->
  <ellipse cx="26" cy="24" rx="2" ry="1" fill="white" fill-opacity="0.4" transform="rotate(-30 26 24)" />
</svg>
