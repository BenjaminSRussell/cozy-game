<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pear Gradient -->
    <radialGradient id="pearGrad" cx="40%" cy="60%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#D4E157" />   <!-- Lime Yellow -->
      <stop offset="100%" stop-color="#AFB42B" /> <!-- Darker Olive-ish base -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowPear" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#33691E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowPear)">
    <!-- Pear Body: Tapered top, heavy bottom -->
    <path d="M32 58 C20 58 12 50 12 38 C12 30 18 20 24 14 C26 12 28 8 32 8 C36 8 38 12 40 14 C46 20 52 30 52 38 C52 50 44 58 32 58 Z"
          fill="url(#pearGrad)"
          stroke="#827717"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Stem -->
    <path d="M32 8 L32 4" 
          fill="none" 
          stroke="#5D4037" 
          stroke-width="2.5" 
          stroke-linecap="round" />
          
    <path d="M32 8 L36 4" 
      fill="none" 
      stroke="#5D4037" 
      stroke-width="2" 
      stroke-linecap="round"
      opacity="0.5" /> <!-- Extra twig -->

    <!-- Leaf -->
    <path d="M32 8 Q24 4 22 10 Q24 16 32 12" 
          fill="#7CB342" 
          stroke="#33691E" 
          stroke-width="1.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- Kindchenschema Face -->
  <!-- Placed low on the heavy bottom part -->
  <g fill="#2E3C02">
    <circle cx="26" cy="40" r="2" />
    <circle cx="38" cy="40" r="2" />
    <path d="M30 46 Q32 48 34 46" fill="none" stroke="#2E3C02" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Specular Highlight -->
  <ellipse cx="44" cy="38" rx="3" ry="5" fill="white" fill-opacity="0.3" transform="rotate(10 44 38)" />
  <circle cx="36" cy="18" r="2" fill="white" fill-opacity="0.2" />
</svg>
