<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Spinach Leaf Gradient -->
    <radialGradient id="spinachGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#58D68D" />   <!-- Bright green -->
      <stop offset="100%" stop-color="#145A32" /> <!-- Deep forest green -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowSpinach" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0B5345" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadowSpinach)">
    <!-- Spinach Leaves (Arrow-shaped, overlapping) -->
    <g fill="url(#spinachGrad)" stroke="#0E6251" stroke-width="2" stroke-linejoin="round">
      <!-- Back leaves -->
      <path d="M32 48 Q18 44 12 32 Q10 24 16 18 Q22 14 28 20 L32 28 Z" />
      <path d="M32 48 Q46 44 52 32 Q54 24 48 18 Q42 14 36 20 L32 28 Z" />
      
      <!-- Front center leaf -->
      <path d="M32 52 Q24 48 20 36 Q18 26 24 20 Q28 16 32 18 Q36 16 40 20 Q46 26 44 36 Q40 48 32 52 Z" />
    </g>

    <!-- Leaf Veins -->
    <g stroke="#0E6251" stroke-width="1.5" opacity="0.4" fill="none" stroke-linecap="round">
      <path d="M32 18 Q30 28 28 38" />
      <path d="M32 18 Q34 28 36 38" />
      <path d="M32 18 L32 44" />
    </g>
  </g>

  <!-- Face -->
  <g fill="#052D1F">
    <circle cx="28" cy="32" r="2" />
    <circle cx="36" cy="32" r="2" />
    <path d="M30 37 Q32 39 34 37" fill="none" stroke="#052D1F" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Highlight -->
  <ellipse cx="26" cy="24" rx="4" ry="2" fill="white" fill-opacity="0.3" transform="rotate(-20 26 24)" />
</svg>
