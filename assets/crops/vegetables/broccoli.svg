<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Floret Radial Gradient -->
    <radialGradient id="floretGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#2ECC71" />   <!-- Bright green floret -->
      <stop offset="100%" stop-color="#1E8449" /> <!-- Deep green floret -->
    </radialGradient>

    <!-- Stem Radial Gradient -->
    <radialGradient id="stemGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#ABEBC6" />   <!-- Soft light green stem -->
      <stop offset="100%" stop-color="#52BE80" /> <!-- Mid green stem -->
    </radialGradient>

    <!-- Base Occlusion / Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0E3314" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rim Light / Shadow Group -->
  <g filter="url(#shadow)">
    <!-- Stem (Rounded/Squishy) -->
    <path d="M32 58 C28 58 26 45 26 35 C26 30 28 28 32 28 C36 28 38 30 38 35 C38 45 36 58 32 58 Z" 
          fill="url(#stemGrad)" 
          stroke="#196F3D" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Floret Blobs (Cloud-like) -->
    <g fill="url(#floretGrad)" stroke="#145A32" stroke-width="2" stroke-linejoin="round">
      <circle cx="32" cy="22" r="14" />
      <circle cx="22" cy="18" r="8" />
      <circle cx="42" cy="18" r="8" />
      <circle cx="32" cy="12" r="6" />
    </g>
  </g>

  <!-- Kindchenschema Face (On the floret) -->
  <g fill="#0B1C0B">
    <circle cx="28" cy="18" r="1.8" /> <!-- Left Eye -->
    <circle cx="36" cy="18" r="1.8" /> <!-- Right Eye -->
    <path d="M30 22 Q32 24 34 22" 
          fill="none" 
          stroke="#0B1C0B" 
          stroke-width="1.2" 
          stroke-linecap="round" />
  </g>

  <!-- Surface Highlight -->
  <ellipse cx="28" cy="14" rx="5" ry="2.5" fill="white" fill-opacity="0.3" transform="rotate(-15 28 14)" />
</svg>
