<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Potato Gradient -->
    <radialGradient id="potatoGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#E59866" />   <!-- Sandy brown -->
      <stop offset="100%" stop-color="#A04000" /> <!-- Deep dirt brown -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowPotato" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#5D4037" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadowPotato)">
    <!-- Potato Body: Irregular, lumpy oval -->
    <path d="M20 25 C14 30 14 45 22 52 C30 58 44 58 52 50 C58 42 56 28 48 22 C40 16 26 18 20 25 Z"
          fill="url(#potatoGrad)"
          stroke="#6E2C00"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Potato "Eyes" (Texture dimples) -->
    <g fill="#873600" opacity="0.6">
        <path d="M26 30 Q28 28 30 30" stroke="#873600" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M44 32 Q46 34 48 32" stroke="#873600" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <path d="M30 48 Q32 50 34 48" stroke="#873600" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Tiny roots sticking out -->
    <path d="M22 50 L20 54" stroke="#D35400" stroke-width="1.5" stroke-linecap="round" />
    <path d="M48 48 L52 52" stroke="#D35400" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Face -->
  <g fill="#3E2723">
    <circle cx="30" cy="38" r="2" />
    <circle cx="42" cy="38" r="2" />
    <path d="M34 44 Q36 46 38 44" fill="none" stroke="#3E2723" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Highlight -->
  <ellipse cx="36" cy="24" rx="6" ry="3" fill="white" fill-opacity="0.2" transform="rotate(-10 36 24)" />
</svg>
