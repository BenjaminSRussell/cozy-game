<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Red Pepper Gradient -->
    <radialGradient id="pepperGrad" cx="30%" cy="30%" r="65%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#FF5252" />   <!-- Bright Red -->
      <stop offset="100%" stop-color="#B71C1C" /> <!-- Deep Red shadow -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowPepper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#550808" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#shadowPepper)">
    <!-- Stem: Green and thick -->
    <path d="M32 20 Q32 10 38 6" 
          fill="none" 
          stroke="#2E7D32" 
          stroke-width="3.5" 
          stroke-linecap="round" />
    <path d="M32 20 L32 22" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" /> 

    <!-- Body: 3 Lobes -->
    <!-- Back Lobe -->
    <path d="M24 20 Q32 14 40 20 L42 40 Q42 50 32 50 Q22 50 22 40 Z"
          fill="#D32F2F"
          stroke="#861212"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />
          
    <!-- Left Lobe -->
    <path d="M32 22 Q16 20 12 30 Q8 40 16 52 Q24 60 32 54"
          fill="url(#pepperGrad)"
          stroke="#861212"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Right Lobe -->
    <path d="M32 22 Q48 20 52 30 Q56 40 48 52 Q40 60 32 54"
          fill="url(#pepperGrad)"
          stroke="#861212"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />
  </g>

  <!-- Face -->
  <g fill="#3E0808">
    <circle cx="26" cy="36" r="2" />
    <circle cx="44" cy="36" r="2" /> <!-- Waaay apart for quirkiness -->
    <path d="M32 42 Q35 44 38 42" fill="none" stroke="#3E0808" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Glossy Highlights -->
  <path d="M18 32 Q20 26 24 26" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  <path d="M48 30 Q50 24 44 26" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.3" />
</svg>
