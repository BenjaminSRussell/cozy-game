<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Onion Skin Gradient -->
    <radialGradient id="onionGrad" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#F9E79F" />   <!-- Golden skin light -->
      <stop offset="100%" stop-color="#B9770E" /> <!-- Copper skin dark -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowOnion" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#784212" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowOnion)">
    <!-- Body: Teardrop shape -->
    <path d="M32 12 Q48 18 50 36 C50 48 42 56 32 56 C22 56 14 48 14 36 Q16 18 32 12 Z"
          fill="url(#onionGrad)"
          stroke="#935116"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Skin Lines (Vertical Striations) -->
    <path d="M32 12 C36 20 40 30 40 40" stroke="#935116" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M32 12 C28 20 24 30 24 40" stroke="#935116" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
    <path d="M32 12 L32 45" stroke="#935116" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3" />

    <!-- Sprout top -->
    <path d="M32 12 L32 6" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" />
    <path d="M32 12 L36 8" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Face -->
  <g fill="#4E342E">
    <circle cx="26" cy="38" r="2" />
    <circle cx="38" cy="38" r="2" />
    <path d="M30 44 Q32 46 34 44" fill="none" stroke="#4E342E" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
