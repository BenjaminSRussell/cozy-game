<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Garlic White Gradient -->
    <radialGradient id="garlicGrad" cx="35%" cy="30%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#FDFEFE" />   <!-- White/Paper -->
      <stop offset="100%" stop-color="#D7DBDD" /> <!-- Grey shadow -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowGarlic" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#515A5A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#shadowGarlic)">
    <!-- Bulb Shape -->
    <!-- Composed of protruding cloves -->
    <path d="M32 14 C42 20 54 30 52 44 C50 54 40 56 32 56 C24 56 14 54 12 44 C10 30 22 20 32 14 Z"
          fill="url(#garlicGrad)"
          stroke="#99A3A4"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Clove Definition Lines -->
    <path d="M32 14 Q40 30 42 46" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M32 14 Q24 30 22 46" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M32 14 L32 48" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6" />

    <!-- Stem / Neck -->
    <path d="M32 14 L32 6" stroke="#D5D8DC" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Face -->
  <g fill="#2C3E50">
    <circle cx="28" cy="40" r="1.8" />
    <circle cx="36" cy="40" r="1.8" />
    <path d="M30 45 Q32 47 34 45" fill="none" stroke="#2C3E50" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
