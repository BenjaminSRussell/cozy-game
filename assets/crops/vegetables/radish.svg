<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Radish Red Gradient -->
    <radialGradient id="radishGrad" cx="30%" cy="30%" r="60%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#FF4081" />   <!-- Bright Pink/Red -->
      <stop offset="100%" stop-color="#C2185B" /> <!-- Deep Pink/Red -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowRadish" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#880E4F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowRadish)">
    <!-- Leafy Top -->
    <path d="M32 20 L26 10 Q32 8 38 10 Z" fill="#2ECC71" stroke="#145A32" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Body -->
    <circle cx="32" cy="34" r="14" 
            fill="url(#radishGrad)" 
            stroke="#880E4F" 
            stroke-width="2.5" />

    <!-- White Root Tip (Dip) -->
    <!-- Masking or just overlaying a white shape at bottom -->
    <path d="M22 42 Q32 38 42 42 C42 46 36 50 32 58 C28 50 22 46 22 42 Z"
          fill="#FDEDEC"
          stroke="#880E4F"
          stroke-width="2.5"
          stroke-linejoin="round" 
          stroke-linecap="round" />
  </g>

  <!-- Face -->
  <g fill="#210512">
    <circle cx="27" cy="32" r="2" />
    <circle cx="37" cy="32" r="2" />
    <path d="M30 36 Q32 38 34 36" fill="none" stroke="#210512" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Highlight -->
  <ellipse cx="26" cy="26" rx="4" ry="2" fill="white" fill-opacity="0.3" transform="rotate(-30 26 26)" />
</svg>
