<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Volumetric Radial Highlight -->
    <radialGradient id="carrotGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#FFB347" />   <!-- Soft highlight orange -->
      <stop offset="100%" stop-color="#E67E22" /> <!-- Deep carrot orange -->
    </radialGradient>

    <!-- Base Occlusion / Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7E3D11" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rim Light / Shadow Group -->
  <g filter="url(#shadow)">
    <!-- Carrot Body (Rounded Taper) -->
    <path d="M32 58 C28 58 22 45 22 30 C22 20 25 12 32 12 C39 12 42 20 42 30 C42 45 36 58 32 58 Z" 
          fill="url(#carrotGrad)" 
          stroke="#BA4A00" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Carrot Texture Lines (Rounded) -->
    <g stroke="#BA4A00" stroke-width="2" stroke-linecap="round" opacity="0.4">
      <path d="M26 25 Q32 26 38 25" />
      <path d="M27 35 Q32 36 37 35" />
      <path d="M29 45 Q32 46 35 45" />
    </g>

    <!-- Carrot Top Leaves (Cloud-like Blobs) -->
    <g fill="#27AE60" stroke="#145A32" stroke-width="1.5" stroke-linejoin="round">
      <path d="M32 12 C32 12 28 4 22 6 C18 8 20 12 24 12 C24 12 28 12 30 12" />
      <circle cx="32" cy="6" r="5" />
      <path d="M32 12 C32 12 36 4 42 6 C46 8 44 12 40 12 C40 12 36 12 34 12" />
    </g>
  </g>

  <!-- Kindchenschema Face -->
  <g fill="#2D1B00">
    <circle cx="28" cy="28" r="2" /> <!-- Left Eye -->
    <circle cx="36" cy="28" r="2" /> <!-- Right Eye -->
    <path d="M30 34 Q32 37 34 34" 
          fill="none" 
          stroke="#2D1B00" 
          stroke-width="1.5" 
          stroke-linecap="round" />
  </g>

  <!-- Surface Highlight -->
  <ellipse cx="28" cy="20" rx="4" ry="1.5" fill="white" fill-opacity="0.3" transform="rotate(-15 28 20)" />
</svg>
