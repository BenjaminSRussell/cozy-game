<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cabbage Radial Gradient -->
    <radialGradient id="cabbageGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#ABEBC6" />   <!-- Soft light green cabbage -->
      <stop offset="100%" stop-color="#27AE60" /> <!-- Core green cabbage -->
    </radialGradient>

    <!-- Outer Leaf Radial Gradient -->
    <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%" fx="25%" fy="25%">
      <stop offset="0%" stop-color="#58D68D" />   <!-- Lighter leaf green -->
      <stop offset="100%" stop-color="#1E8449" /> <!-- Darker leaf green -->
    </radialGradient>

    <!-- Base Occlusion / Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0E3314" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rim Light / Shadow Group -->
  <g filter="url(#shadow)">
    <!-- Outer Leaves (Puffy/Rounded) -->
    <g fill="url(#leafGrad)" stroke="#145A32" stroke-width="2.5" stroke-linejoin="round">
      <path d="M32 54 C12 54 8 36 12 24 C16 12 28 10 32 10 C36 10 48 12 52 24 C56 36 52 54 32 54 Z" />
      <path d="M32 54 C45 54 58 40 58 28 C58 18 45 12 32 12" fill="none" />
      <path d="M32 54 C19 54 6 40 6 28 C6 18 19 12 32 12" fill="none" />
    </g>

    <!-- Central Globe (Puffy) -->
    <circle cx="32" cy="34" r="16" 
            fill="url(#cabbageGrad)" 
            stroke="#196F3D" 
            stroke-width="2" />
  </g>

  <!-- Kindchenschema Face -->
  <g fill="#0B1C0B">
    <circle cx="27" cy="32" r="2" /> <!-- Left Eye -->
    <circle cx="37" cy="32" r="2" /> <!-- Right Eye -->
    <path d="M30 38 Q32 41 34 38" 
          fill="none" 
          stroke="#0B1C0B" 
          stroke-width="1.5" 
          stroke-linecap="round" />
  </g>

  <!-- Surface Highlight -->
  <ellipse cx="26" cy="24" rx="5" ry="2.5" fill="white" fill-opacity="0.3" transform="rotate(-15 26 24)" />
</svg>
