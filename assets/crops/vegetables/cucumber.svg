<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cucumber Gradient -->
    <linearGradient id="cukeGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#58D68D" />   <!-- Fresh Green -->
      <stop offset="100%" stop-color="#196F3D" /> <!-- Dark Green -->
    </linearGradient>

    <!-- Base Occlusion -->
    <filter id="shadowCuke" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0E4B25" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowCuke)">
    <!-- Body: Long and slightly curved cylinder -->
    <!-- Rotated slightly for visual interest -->
    <path d="M22 10 C16 10 14 16 16 22 L22 50 C24 56 30 58 36 56 L44 54 C50 52 52 46 50 40 L40 12 C38 6 32 4 26 6 L22 10 Z"
          fill="url(#cukeGrad)"
          stroke="#145A32"
          stroke-width="2.5"
          stroke-linejoin="round"
          stroke-linecap="round" />
          
    <!-- Warts/Bumps -->
    <g fill="#A9DFBF" opacity="0.4">
        <circle cx="24" cy="16" r="1.5" />
        <circle cx="36" cy="14" r="1.5" />
        <circle cx="42" cy="24" r="1.5" />
        <circle cx="24" cy="36" r="1.5" />
        <circle cx="26" cy="48" r="1.5" />
        <circle cx="38" cy="42" r="1.5" />
        <circle cx="44" cy="50" r="1.5" />
    </g>

    <!-- Stem cap -->
    <path d="M24 8 L22 4" stroke="#145A32" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Face -->
  <g fill="#0E2E18">
    <circle cx="28" cy="30" r="2" />
    <circle cx="42" cy="28" r="2" /> <!-- Perspective shift -->
    <path d="M32 36 Q36 38 40 35" fill="none" stroke="#0E2E18" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Highlight stroke -->
  <path d="M26 12 Q38 10 46 36" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.2" />
</svg>
