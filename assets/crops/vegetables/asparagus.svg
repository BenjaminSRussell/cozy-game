<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Stalk Radial Gradient -->
    <radialGradient id="stalkGrad" cx="35%" cy="40%" r="60%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#58D68D" />   <!-- Soft light green -->
      <stop offset="100%" stop-color="#229954" /> <!-- Resolute green -->
    </radialGradient>

    <!-- Base Occlusion / Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0E3314" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rim Light / Shadow Group -->
  <g filter="url(#shadow)">
    <!-- Stalk Body (Rounded Rect/Path) -->
    <path d="M28 58 C28 58 26 35 26 20 C26 12 30 8 32 8 C34 8 38 12 38 20 C38 35 36 58 36 58 Z" 
          fill="url(#stalkGrad)" 
          stroke="#196F3D" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Scales / Leaves on Stalk (Rounded Trianlges) -->
    <g fill="#1D8348" stroke="#145A32" stroke-width="1.5" stroke-linejoin="round">
      <path d="M28 25 L32 28 L36 25 Z" />
      <path d="M28 35 L32 38 L36 35 Z" />
      <path d="M29 45 L32 48 L35 45 Z" />
    </g>

    <!-- Terminal Bud (Puffy) -->
    <path d="M32 8 C28 8 26 12 26 16 C26 20 28 22 32 22 C36 22 38 20 38 16 C38 12 36 8 32 8 Z" 
          fill="#82E0AA" 
          stroke="#196F3D" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
  </g>

  <!-- Kindchenschema Face -->
  <g fill="#0B1C0B">
    <circle cx="28" cy="31" r="1.5" /> <!-- Left Eye -->
    <circle cx="36" cy="31" r="1.5" /> <!-- Right Eye -->
    <path d="M30 36 Q32 38 34 36" 
          fill="none" 
          stroke="#0B1C0B" 
          stroke-width="1.2" 
          stroke-linecap="round" />
  </g>

  <!-- Surface Highlight -->
  <ellipse cx="28" cy="18" rx="3" ry="1.5" fill="white" fill-opacity="0.3" transform="rotate(-10 28 18)" />
</svg>
