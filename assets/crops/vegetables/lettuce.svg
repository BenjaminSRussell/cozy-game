<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Lettuce Leaf Gradient -->
    <radialGradient id="lettuceGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#ABEBC6" />   <!-- Pale green -->
      <stop offset="100%" stop-color="#52BE80" /> <!-- Mid green -->
    </radialGradient>

    <!-- Base Occlusion -->
    <filter id="shadowLettuce" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#145A32" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadowLettuce)">
    <!-- Outer Leaves (Ruffled, cloud-like) -->
    <g fill="url(#lettuceGrad)" stroke="#27AE60" stroke-width="2" stroke-linejoin="round">
      <!-- Back layer -->
      <path d="M32 52 Q12 48 8 32 Q6 16 20 12 Q32 10 44 12 Q58 16 56 32 Q52 48 32 52 Z" />
      
      <!-- Mid layer (ruffles) -->
      <path d="M32 48 Q16 44 14 30 Q12 20 24 16 Q32 14 40 16 Q52 20 50 30 Q48 44 32 48 Z" />
      
      <!-- Inner layer -->
      <circle cx="32" cy="32" r="12" fill="#7DCEA0" stroke="#1E8449" stroke-width="1.5" />
    </g>

    <!-- Leaf Veins (Subtle) -->
    <g stroke="#27AE60" stroke-width="1" opacity="0.3" fill="none" stroke-linecap="round">
      <path d="M32 20 Q28 26 24 32" />
      <path d="M32 20 Q36 26 40 32" />
      <path d="M32 20 L32 36" />
    </g>
  </g>

  <!-- Face -->
  <g fill="#0E3314">
    <circle cx="28" cy="30" r="2" />
    <circle cx="36" cy="30" r="2" />
    <path d="M30 35 Q32 37 34 35" fill="none" stroke="#0E3314" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Highlight -->
  <ellipse cx="24" cy="22" rx="5" ry="2.5" fill="white" fill-opacity="0.25" transform="rotate(-15 24 22)" />
</svg>
