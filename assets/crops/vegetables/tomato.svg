<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Volumetric Radial Highlight -->
    <radialGradient id="tomatoGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FF5E5E" />   <!-- Soft red highlight -->
      <stop offset="100%" stop-color="#C0392B" /> <!-- Deep tomato red -->
    </radialGradient>

    <!-- Base Occlusion / Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4D1D19" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rim Light / Shadow Group -->
  <g filter="url(#shadow)">
    <!-- Tomato Body (Squishy Round) -->
    <path d="M32 54 C22 54 12 50 12 36 C12 22 22 14 32 14 C42 14 52 22 52 36 C52 50 42 54 32 54 Z" 
          fill="url(#tomatoGrad)" 
          stroke="#922B21" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Tomato Stem (Rounded) -->
    <path d="M32 14 L32 8" 
          fill="none" 
          stroke="#1E8449" 
          stroke-width="3" 
          stroke-linecap="round" />

    <!-- Star Leaves (Puffy/Rounded) -->
    <g fill="#27AE60" stroke="#145A32" stroke-width="1.5" stroke-linejoin="round">
      <path d="M32 14 L24 10 Q32 8 40 10 Z" />
      <path d="M32 14 L28 18 Q32 20 36 18 Z" />
      <path d="M32 14 L32 20 L32 14 Z" /> <!-- Center point -->
    </g>
  </g>

  <!-- Kindchenschema Face -->
  <g fill="#2D0B0B">
    <circle cx="26" cy="34" r="2" /> <!-- Left Eye -->
    <circle cx="38" cy="34" r="2" /> <!-- Right Eye -->
    <path d="M29 40 Q32 43 35 40" 
          fill="none" 
          stroke="#2D0B0B" 
          stroke-width="1.5" 
          stroke-linecap="round" />
  </g>

  <!-- Blush Cheeks (Soft/Transparent) -->
  <g fill="#E74C3C" opacity="0.3">
    <circle cx="20" cy="38" r="3" />
    <circle cx="44" cy="38" r="3" />
  </g>

  <!-- Surface Highlight -->
  <ellipse cx="24" cy="24" rx="4" ry="2" fill="white" fill-opacity="0.3" transform="rotate(-30 24 24)" />
</svg>
