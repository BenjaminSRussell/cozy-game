<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tomato Gradient -->
    <radialGradient id="tomatoGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FF5E5E" />
      <stop offset="100%" stop-color="#C0392B" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="tomatoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4D1D19" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#tomatoShadow)">
    <!-- Tomato Body - Perfect round shape -->
    <circle cx="32" cy="32" r="16" 
            fill="url(#tomatoGrad)" 
            stroke="#922B21" 
            stroke-width="2" />

    <!-- Stem Calyx - Star-shaped green leaves -->
    <g fill="#27AE60" stroke="#145A32" stroke-width="1" stroke-linejoin="round">
      <path d="M32 16 L28 12 L32 14 L36 12 Z" />
      <path d="M32 16 L28 18 L32 16 L36 18 Z" />
    </g>
  </g>

  <!-- Simple face -->
  <g fill="#2D0B0B">
    <circle cx="27" cy="30" r="1.5" />
    <circle cx="37" cy="30" r="1.5" />
    <path d="M30 36 Q32 38 34 36" 
          fill="none" 
          stroke="#2D0B0B" 
          stroke-width="1.2" 
          stroke-linecap="round" />
  </g>

  <!-- Single highlight -->
  <ellipse cx="26" cy="24" rx="2" ry="1" fill="white" fill-opacity="0.4" transform="rotate(-30 26 24)" />
</svg>
