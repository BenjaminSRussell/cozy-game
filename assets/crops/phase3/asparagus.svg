<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <!-- Crop Body Gradient (Spherical Volume) -->
    <radialGradient id="grad_asparagus" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#58D68D" />
      <stop offset="100%" stop-color="#229954" />
    </radialGradient>
    
    <!-- Foliage Gradient -->
    <linearGradient id="foliage_asparagus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" style="stop-opacity:1" />
      <stop offset="100%" stop-color="#1B5E20" style="stop-opacity:1" /> <!-- Darker green bottom -->
    </linearGradient>

    <!-- Soft Drop Shadow for Grounding -->
    <filter id="shadow_asparagus" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
        <g filter="url(#shadow_asparagus)">
          <path d="M32 50 L32 25" stroke="#558B2F" stroke-width="4" stroke-linecap="round" />
          <path d="M32 40 L20 30" stroke="#558B2F" stroke-width="3" stroke-linecap="round" />
          <path d="M32 35 L44 25" stroke="#558B2F" stroke-width="3" stroke-linecap="round" />
          <!-- Leaves -->
          <circle cx="20" cy="30" r="5" fill="#7CB342" stroke="#196F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="44" cy="25" r="5" fill="#7CB342" stroke="#196F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="32" cy="20" r="6" fill="#7CB342" stroke="#196F3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </g>
</svg>