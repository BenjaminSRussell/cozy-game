<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Grain Radial Gradient -->
    <radialGradient id="grainGrad" cx="35%" cy="35%" r="60%" fx="30%" fy="25%">
      <stop offset="0%" stop-color="#F7DC6F" />   <!-- Soft yellow grain -->
      <stop offset="100%" stop-color="#D4AC0D" /> <!-- Golden brown grain -->
    </radialGradient>

    <!-- Stalk Radial Gradient -->
    <radialGradient id="wheatStalkGrad" cx="40%" cy="30%" r="60%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#F9E79F" />   <!-- Soft cream stalk -->
      <stop offset="100%" stop-color="#B7950B" /> <!-- Deep golden stalk -->
    </radialGradient>

    <!-- Base Occlusion / Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4D3D09" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rim Light / Shadow Group -->
  <g filter="url(#shadow)">
    <!-- Main Stalk (Rounded/Drooping) -->
    <path d="M34 58 C34 50 32 40 32 20 C32 10 38 6 42 6" 
          fill="none" 
          stroke="url(#wheatStalkGrad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Grains (Puffy/Rounded) -->
    <g fill="url(#grainGrad)" stroke="#9A7D0A" stroke-width="1.5" stroke-linejoin="round">
      <!-- Left Side -->
      <path d="M30 15 C24 15 20 18 20 22 C20 26 24 28 30 28 Z" />
      <path d="M28 25 C22 25 18 28 18 32 C18 36 22 38 28 38 Z" />
      <path d="M26 35 C20 35 16 38 16 42 C16 46 20 48 26 48 Z" />
      
      <!-- Right Side -->
      <path d="M34 18 C40 18 44 21 44 25 C44 29 40 31 34 31 Z" />
      <path d="M36 28 C42 28 46 31 46 35 C46 39 42 41 36 41 Z" />
      <path d="M38 38 C44 38 48 41 48 45 C48 49 44 51 38 51 Z" />

      <!-- Top Grain -->
      <circle cx="35" cy="12" r="4.5" />
    </g>
  </g>

  <!-- Kindchenschema Face (On the stalk) -->
  <g fill="#2D1B00">
    <circle cx="32" cy="30" r="1.5" /> <!-- Left Eye -->
    <circle cx="32" cy="35" r="1.5" /> <!-- Right Eye (vertical layout for thin stalk) -->
    <path d="M30 40 Q32 42 34 40" 
          fill="none" 
          stroke="#2D1B00" 
          stroke-width="1" 
          stroke-linecap="round" />
  </g>

  <!-- Surface Highlight -->
  <ellipse cx="24" cy="20" rx="3" ry="1.5" fill="white" fill-opacity="0.3" transform="rotate(-15 24 20)" />
</svg>
