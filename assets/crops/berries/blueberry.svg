<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blueGrad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5DADE2"/>
      <stop offset="100%" stop-color="#1F618D"/>
    </radialGradient>
    <filter id="shadowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#154360" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadowBlue)">
    <!-- Stem cluster -->
    <path d="M32 16 L32 12" stroke="#27AE60" stroke-width="2" stroke-linecap="round"/>
    <!-- Berry cluster -->
    <circle cx="24" cy="28" r="10" fill="url(#blueGrad)" stroke="#1A5276" stroke-width="2"/>
    <circle cx="40" cy="28" r="10" fill="url(#blueGrad)" stroke="#1A5276" stroke-width="2"/>
    <circle cx="32" cy="38" r="10" fill="url(#blueGrad)" stroke="#1A5276" stroke-width="2"/>
    <circle cx="32" cy="22" r="10" fill="url(#blueGrad)" stroke="#1A5276" stroke-width="2"/>
    <!-- Bloom ends -->
    <g fill="#34495E" opacity="0.4">
      <circle cx="24" cy="24" r="2"/>
      <circle cx="40" cy="24" r="2"/>
      <circle cx="32" cy="18" r="2"/>
      <circle cx="32" cy="34" r="2"/>
    </g>
  </g>
  <!-- Face on center berry -->
  <g fill="#0B1929">
    <circle cx="29" cy="36" r="1.5"/>
    <circle cx="35" cy="36" r="1.5"/>
    <path d="M30 40 Q32 41 34 40" fill="none" stroke="#0B1929" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
