<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grapeGrad" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#6C3483"/>
    </radialGradient>
    <filter id="shadowGrape" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#4A235A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadowGrape)">
    <!-- Stem -->
    <path d="M32 12 Q30 8 28 6" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M32 12 Q42 8 44 14 Q42 20 34 18" fill="#58B19F" stroke="#1B5E20" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Grape bunch (triangular arrangement) -->
    <circle cx="32" cy="20" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="24" cy="28" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="40" cy="28" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="32" cy="30" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="20" cy="38" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="32" cy="40" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="44" cy="38" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="26" cy="48" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
    <circle cx="38" cy="48" r="6" fill="url(#grapeGrad)" stroke="#512E5F" stroke-width="1.5"/>
  </g>
  <!-- Face on center grape -->
  <g fill="#1C0A26">
    <circle cx="29" cy="38" r="1.5"/>
    <circle cx="35" cy="38" r="1.5"/>
    <path d="M30 42 Q32 43 34 42" fill="none" stroke="#1C0A26" stroke-width="1" stroke-linecap="round"/>
  </g>
</svg>
