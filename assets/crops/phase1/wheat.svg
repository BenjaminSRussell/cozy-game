<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wheat Grain Gradient -->
    <linearGradient id="wheatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DC6F" />
      <stop offset="100%" stop-color="#D4AC0D" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="wheatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#wheatShadow)">
    <!-- Wheat Stalks -->
    <g stroke="#8B7355" stroke-width="2" fill="none">
      <line x1="20" y1="48" x2="20" y2="20" />
      <line x1="32" y1="48" x2="32" y2="16" />
      <line x1="44" y1="48" x2="44" y2="20" />
    </g>
    
    <!-- Wheat Heads - Distinctive grain clusters -->
    <g fill="url(#wheatGrad)" stroke="#B8860B" stroke-width="1">
      <!-- Left stalk -->
      <ellipse cx="20" cy="18" rx="3" ry="6" />
      <ellipse cx="18" cy="16" rx="2" ry="4" />
      <ellipse cx="22" cy="16" rx="2" ry="4" />
      
      <!-- Center stalk -->
      <ellipse cx="32" cy="14" rx="4" ry="8" />
      <ellipse cx="29" cy="12" rx="2.5" ry="5" />
      <ellipse cx="35" cy="12" rx="2.5" ry="5" />
      
      <!-- Right stalk -->
      <ellipse cx="44" cy="18" rx="3" ry="6" />
      <ellipse cx="42" cy="16" rx="2" ry="4" />
      <ellipse cx="46" cy="16" rx="2" ry="4" />
    </g>
  </g>
</svg>