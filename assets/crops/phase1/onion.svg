<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Onion Body Gradient -->
    <radialGradient id="onionGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="100%" stop-color="#B9770E" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="onionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#onionShadow)">
    <!-- Onion Body - Flattened sphere -->
    <ellipse cx="32" cy="32" rx="12" ry="14" 
             fill="url(#onionGrad)" 
             stroke="#935116" 
             stroke-width="1.5" />
    
    <!-- Root hairs at bottom -->
    <g stroke="#8B4513" stroke-width="0.5" fill="none">
      <line x1="30" y1="46" x2="28" y2="48" />
      <line x1="32" y1="46" x2="32" y2="49" />
      <line x1="34" y1="46" x2="36" y2="48" />
    </g>
    
    <!-- Stem top -->
    <circle cx="32" cy="18" r="2" fill="#8B7355" stroke="#6B4423" stroke-width="1" />
  </g>
</svg>