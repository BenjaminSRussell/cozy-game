<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Strawberry Body Gradient -->
    <radialGradient id="strawberryGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#C0392B" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="strawberryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#strawberryShadow)">
    <!-- Strawberry Body - Heart shape -->
    <path d="M32 44 C24 44 16 38 16 30 C16 22 24 16 32 16 C40 16 48 22 48 30 C48 38 40 44 32 44 Z"
          fill="url(#strawberryGrad)" 
          stroke="#922B21" 
          stroke-width="2" 
          stroke-linejoin="round" />
    
    <!-- Strawberry Seeds - Small dots -->
    <g fill="#F39C12">
      <circle cx="24" cy="28" r="0.8" />
      <circle cx="28" cy="26" r="0.8" />
      <circle cx="32" cy="25" r="0.8" />
      <circle cx="36" cy="26" r="0.8" />
      <circle cx="40" cy="28" r="0.8" />
      <circle cx="26" cy="32" r="0.8" />
      <circle cx="32" cy="31" r="0.8" />
      <circle cx="38" cy="32" r="0.8" />
    </g>
    
    <!-- Leaf Crown -->
    <g fill="#27AE60" stroke="#145A32" stroke-width="1" stroke-linejoin="round">
      <path d="M32 16 L28 12 L32 14 L36 12 Z" />
    </g>
  </g>
</svg>