<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Carrot Body Gradient -->
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8C42" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
    
    <!-- Foliage Gradient -->
    <linearGradient id="carrotTops" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="carrotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#carrotShadow)">
    <!-- Carrot Body - Tapered cone shape -->
    <path d="M32 48 L28 32 L32 16 L36 32 Z" 
          fill="url(#carrotGrad)" 
          stroke="#D35400" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
    
    <!-- Carrot Tops - Frond-like leaves -->
    <g fill="url(#carrotTops)" stroke="#145A32" stroke-width="1" stroke-linejoin="round">
      <path d="M32 16 L30 12 L28 8 M32 16 L32 10 M32 16 L34 12 L36 8" />
      <ellipse cx="32" cy="16" rx="4" ry="2" fill="#27AE60" />
    </g>
  </g>
</svg>