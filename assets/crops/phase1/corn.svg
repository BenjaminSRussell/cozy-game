<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Corn Kernel Gradient -->
    <linearGradient id="cornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B" />
      <stop offset="100%" stop-color="#F9A825" />
    </linearGradient>
    
    <!-- Husk Gradient -->
    <linearGradient id="cornHusk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB342" />
      <stop offset="100%" stop-color="#33691E" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="cornShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#cornShadow)">
    <!-- Corn Cob - Elliptical shape with kernel texture -->
    <ellipse cx="32" cy="32" rx="8" ry="16" 
             fill="url(#cornGrad)" 
             stroke="#F57F17" 
             stroke-width="1.5" />
    
    <!-- Kernel rows - Simple grid pattern -->
    <g stroke="#F9A825" stroke-width="0.5" fill="none">
      <line x1="28" y1="20" x2="28" y2="44" />
      <line x1="32" y1="20" x2="32" y2="44" />
      <line x1="36" y1="20" x2="36" y2="44" />
      <line x1="26" y1="24" x2="38" y2="24" />
      <line x1="26" y1="28" x2="38" y2="28" />
      <line x1="26" y1="32" x2="38" y2="32" />
      <line x1="26" y1="36" x2="38" y2="36" />
      <line x1="26" y1="40" x2="38" y2="40" />
    </g>
    
    <!-- Husk leaves at top -->
    <g fill="url(#cornHusk)" stroke="#1B5E20" stroke-width="1" stroke-linejoin="round">
      <path d="M32 16 L28 12 L24 8 M32 16 L32 10 M32 16 L36 12 L40 8" />
    </g>
  </g>
</svg>