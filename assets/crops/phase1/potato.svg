<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Potato Body Gradient -->
    <radialGradient id="potatoGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#E59866" />
      <stop offset="100%" stop-color="#A04000" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="potatoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#potatoShadow)">
    <!-- Potato Body - Irregular oval shape -->
    <ellipse cx="32" cy="32" rx="14" ry="10" 
             fill="url(#potatoGrad)" 
             stroke="#8B4513" 
             stroke-width="1.5" 
             transform="rotate(15 32 32)" />
    
    <!-- Potato "Eyes" - Small indentations -->
    <g fill="#8B4513">
      <circle cx="28" cy="30" r="1" />
      <circle cx="36" cy="34" r="1" />
      <circle cx="30" cy="36" r="0.8" />
    </g>
  </g>
</svg>