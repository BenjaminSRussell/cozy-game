<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Lettuce Gradient -->
    <linearGradient id="lettuceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ABEBC6" />
      <stop offset="100%" stop-color="#52BE80" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="lettuceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#lettuceShadow)">
    <!-- Lettuce Head - Ruffled leaf layers -->
    <g fill="url(#lettuceGrad)" stroke="#27AE60" stroke-width="1" stroke-linejoin="round">
      <!-- Outer leaves -->
      <path d="M32 48 Q20 40 20 28 Q20 20 28 16 Q32 14 36 16 Q44 20 44 28 Q44 40 32 48" />
      <!-- Middle leaves -->
      <path d="M32 40 Q24 34 24 26 Q24 20 30 18 Q32 17 34 18 Q40 20 40 26 Q40 34 32 40" fill="#82E0AA" />
      <!-- Inner leaves -->
      <path d="M32 32 Q28 28 28 24 Q28 20 31 19 Q32 18 33 19 Q36 20 36 24 Q36 28 32 32" fill="#A3E4D7" />
    </g>
  </g>
</svg>