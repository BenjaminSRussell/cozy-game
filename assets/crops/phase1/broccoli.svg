<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Broccoli Florets Gradient -->
    <radialGradient id="broccoliGrad" cx="35%" cy="35%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#1E8449" />
    </radialGradient>

    <!-- Shadow -->
    <filter id="broccoliShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#broccoliShadow)">
    <!-- Broccoli Stalk -->
    <rect x="30" y="32" width="4" height="16" 
          fill="#F39C12" 
          stroke="#D68910" 
          stroke-width="1" />
    
    <!-- Broccoli Head - Tree-like clusters -->
    <g fill="url(#broccoliGrad)" stroke="#145A32" stroke-width="1" stroke-linejoin="round">
      <!-- Main cluster -->
      <circle cx="32" cy="28" r="8" />
      <!-- Side clusters -->
      <circle cx="24" cy="30" r="5" />
      <circle cx="40" cy="30" r="5" />
      <circle cx="28" cy="22" r="4" />
      <circle cx="36" cy="22" r="4" />
      <circle cx="32" cy="18" r="3" />
    </g>
  </g>
</svg>