<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <!-- Crop Body Gradient (Spherical Volume) -->
    <radialGradient id="grad_lettuce" cx="30%" cy="30%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#ABEBC6" />
      <stop offset="100%" stop-color="#52BE80" />
    </radialGradient>
    
    <!-- Foliage Gradient -->
    <linearGradient id="foliage_lettuce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" style="stop-opacity:1" />
      <stop offset="100%" stop-color="#1B5E20" style="stop-opacity:1" /> <!-- Darker green bottom -->
    </linearGradient>

    <!-- Soft Drop Shadow for Grounding -->
    <filter id="shadow_lettuce" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
      <g filter="url(#shadow_lettuce)">
         <!-- Foliage Base -->
         <path d="M32 54 L32 45" stroke="#33691E" stroke-width="4" />
         <circle cx="22" cy="30" r="8" fill="url(#grad_lettuce)" stroke="#145A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="42" cy="30" r="8" fill="url(#grad_lettuce)" stroke="#145A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="32" cy="40" r="8" fill="url(#grad_lettuce)" stroke="#145A32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
         <!-- Highlight Shine -->
         <ellipse cx="40" cy="28" rx="4" ry="2" fill="white" opacity="0.4" transform="rotate(-45 40 28)"/>
      </g>
  <g fill="#3E2723" transform="translate(0, 3)">
    <circle cx="26" cy="34" r="2.5" /> 
    <circle cx="38" cy="34" r="2.5" /> 
    <path d="M29 39 Q32 42 35 39" fill="none" stroke="#3E2723" stroke-width="1.8" stroke-linecap="round" />
    <!-- Cheeks -->
    <circle cx="24" cy="38" r="2" fill="#FF8A80" opacity="0.6"/>
    <circle cx="40" cy="38" r="2" fill="#FF8A80" opacity="0.6"/>
  </g>
</svg>